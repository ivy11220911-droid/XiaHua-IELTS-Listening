le thing by the summer deadline.","cn":"这样，在夏季截止日期前完成整篇论文就还有充足时间。","analysis":""},{"time":"00:01:37,000 --> 00:01:40,000","html":"<strong>Tutor:<\/strong> Anyway, looks like you're on track.","cn":"总之，看起来你的进度正常。","analysis":""},{"time":"00:01:40,000 --> 00:01:43,000","html":"<strong>Tutor:<\/strong> I've been through your <mark style=\"background-color: #bbf7d0;\">first chapter<\/mark> now and I was quite impressed.","cn":"我已经读完你的<mark style=\"background-color: #bbf7d0;\">第一章<\/mark>，印象相当不错。","analysis":"<strong>答案解析：<\/strong>第21题选 <strong>B<\/strong>。导师说刚读完Kathy的“first chapter”，即论文的介绍性章节；结果部分尚未完成，文献综述则是Kathy正在进行的工作。"},{"time":"00:01:43,000 --> 00:01:45,000","html":"<strong>Kathy:<\/strong> Oh, that's a relief.","cn":"哦，那我就放心了。","analysis":""},{"time":"00:01:45,000 --> 00:01:49,000","html":"<strong>Tutor:<\/strong> Well, sometimes your <mark style=\"background-color: #fecaca;\">sentences are a little long and over complex<\/mark>.","cn":"不过，有时你的<mark style=\"background-color: #fecaca;\">句子有点长，而且过于复杂<\/mark>。","analysis":""},{"time":"00:01:49,000 --> 00:01:53,000","html":"<strong>Tutor:<\/strong> But the <mark style=\"background-color: #bbf7d0;\">overall structure<\/mark> of the piece is very clear.","cn":"但整篇文章的<mark style=\"background-color: #bbf7d0;\">总体结构<\/mark>非常清楚。","analysis":""},{"time":"00:01:53,000 --> 00:01:58,000","html":"<strong>Tutor:<\/strong> I'd recommend you get a critical friend to go through it with you.","cn":"我建议找一位能提出批评意见的朋友和你一起检查。","analysis":""},{"time":"00:01:58,000 --> 00:02:04,000","html":"<strong>Tutor:<\/strong> Then once you've built in <mark style=\"background-color: #fecaca;\">citations of other work<\/mark> in the field, I think it'll be pretty good.","cn":"等你再加入本领域<mark style=\"background-color: #fecaca;\">其他研究的引用<\/mark>后，我认为就会相当不错。","analysis":"<strong>答案解析：<\/strong>第22题选 <strong>A<\/strong>。导师称赞文章总体结构清楚，即组织安排好；句子过长、过于复杂以及引用尚待补充都是需要改进之处。"},{"time":"00:02:04,000 --> 00:02:09,000","html":"<strong>Kathy:<\/strong> Oh, thanks. I was pleased I decided to focus on water pumps.","cn":"谢谢。我很高兴自己决定把重点放在水泵上。","analysis":""},{"time":"00:02:09,000 --> 00:02:14,000","html":"<strong>Tutor:<\/strong> You seem to be testing an <mark style=\"background-color: #fecaca;\">appropriate range<\/mark> of pump design.","cn":"你似乎测试了<mark style=\"background-color: #fecaca;\">范围合适<\/mark>的水泵设计。","analysis":""},{"time":"00:02:14,000 --> 00:02:19,000","html":"<strong>Tutor:<\/strong> Lots of students make the mistake of either restricting their range too much","cn":"很多学生会犯这样的错误：要么把范围限制得过窄，","analysis":""},{"time":"00:02:19,000 --> 00:02:22,000","html":"<strong>Tutor:<\/strong> or conversely not narrowing it down enough.","cn":"要么相反，没有充分缩小范围。","analysis":""},{"time":"00:02:22,000 --> 00:02:25,000","html":"<strong>Tutor:<\/strong> You've managed to avoid those twin traps.","cn":"你成功避开了这两个陷阱。","analysis":""},{"time":"00:02:25,000 --> 00:02:31,000","html":"<strong>Tutor:<\/strong> However, I think you'd get more convincing results if you took some <mark style=\"background-color: #bbf7d0;\">additional measurements<\/mark>.","cn":"不过，如果<mark style=\"background-color: #bbf7d0;\">再进行一些测量<\/mark>，你的结果会更有说服力。","analysis":""},{"time":"00:02:31,000 --> 00:02:34,000","html":"<strong>Tutor:<\/strong> I've noted exactly what I mean on your work.","cn":"我已经在你的作业上准确注明了我的意思。","analysis":""},{"time":"00:02:34,000 --> 00:02:37,000","html":"<strong>Kathy:<\/strong> Yes, I thought that might be necessary.","cn":"是的，我也觉得可能有必要这样做。","analysis":""},{"time":"00:02:37,000 --> 00:02:41,000","html":"<strong>Kathy:<\/strong> And I know I need to get down to some <mark style=\"background-color: #fecaca;\">more library work<\/mark> too.","cn":"我也知道自己还需要<mark style=\"background-color: #fecaca;\">再做一些图书馆研究<\/mark>。","analysis":""},{"time":"00:02:41,000 --> 00:02:44,000","html":"<strong>Tutor:<\/strong> Well, I <mark style=\"background-color: #fecaca;\">don't think that's essential<\/mark> at the moment.","cn":"我认为目前那<mark style=\"background-color: #fecaca;\">并不是必要的<\/mark>。","analysis":"<strong>答案解析：<\/strong>第23题选 <strong>B<\/strong>。导师建议增加测量数据，Kathy也表示同意。导师认为追加图书馆研究目前并非必要，而选题范围已经合适。"},{"time":"00:02:44,000 --> 00:02:48,000","html":"<strong>Kathy:<\/strong> Oh, right. So what do you suggest I do next?","cn":"明白了。那你建议我接下来做什么？","analysis":""},{"time":"00:02:48,000 --> 00:02:53,000","html":"<strong>Kathy:<\/strong> Repeat my last experiment using different variables?","cn":"用不同变量重复上一次实验吗？","analysis":""},{"time":"00:02:53,000 --> 00:02:57,000","html":"<strong>Tutor:<\/strong> Well, you could have a word with James Higgins tomorrow.","cn":"你明天可以去和James Higgins谈一谈。","analysis":""},{"time":"00:02:57,000 --> 00:03:01,000","html":"<strong>Tutor:<\/strong> He's coming here to give a lecture on hydraulics to the faculty.","cn":"他会来这里给学院作一场液压学讲座。","analysis":""},{"time":"00:03:01,000 --> 00:03:05,000","html":"<strong>Tutor:<\/strong> And it would be a great chance to have a chat with him.","cn":"这是一个和他交流的绝佳机会。","analysis":""},{"time":"00:03:05,000 --> 00:03:13,000","html":"<strong>Tutor:<\/strong> Especially as your experimental work has drawn so heavily from his last article in the British engineering journal.","cn":"尤其是你的实验工作大量借鉴了他最近发表在《英国工程期刊》上的文章。","analysis":""},{"time":"00:03:13,000 --> 00:03:14,000","html":"<strong>Kathy:<\/strong> Oh, fantastic.","cn":"太棒了。","analysis":""},{"time":"00:03:14,000 --> 00:03:19,000","html":"<strong>Tutor:<\/strong> And you never know how successful a chat with him might turn out to be.","cn":"而且你永远不知道和他谈话最后可能带来多大的收获。","analysis":""},{"time":"00:03:19,000 --> 00:03:23,000","html":"<strong>Tutor:<\/strong> I got my <mark style=\"background-color: #bbf7d0;\">first research post<\/mark> when I was a final year student","cn":"我在毕业年级时获得了<mark style=\"background-color: #bbf7d0;\">第一份研究职位<\/mark>，","analysis":""},{"time":"00:03:23,000 --> 00:03:28,000","html":"<strong>Tutor:<\/strong> and asked a visiting professor to explain what he meant in some article he'd written.","cn":"当时我请一位来访教授解释他所写文章中的含义。","analysis":""},{"time":"00:03:28,000 --> 00:03:33,000","html":"<strong>Tutor:<\/strong> So I <mark style=\"background-color: #bbf7d0;\">urge all my students to take any such opportunity<\/mark> that arises.","cn":"所以我<mark style=\"background-color: #bbf7d0;\">敦促所有学生抓住任何这样的机会<\/mark>。","analysis":""},{"time":"00:03:33,000 --> 00:03:36,000","html":"<strong>Kathy:<\/strong> But <mark style=\"background-color: #fecaca;\">times have changed<\/mark>.","cn":"但<mark style=\"background-color: #fecaca;\">时代已经变了<\/mark>。","analysis":""},{"time":"00:03:36,000 --> 00:03:40,000","html":"<strong>Kathy:<\/strong> People like that are too busy to talk to mere students these days.","cn":"现在那样的人太忙了，没时间和普通学生交谈。","analysis":""},{"time":"00:03:40,000 --> 00:03:42,000","html":"<strong>Tutor:<\/strong> I don't know about that.","cn":"我不太认同。","analysis":"<strong>答案解析：<\/strong>第24题选 <strong>C<\/strong>。导师用自己因主动请教来访教授而获得研究职位的经历，鼓励Kathy也抓住与专家交流的机会。“时代变了”是Kathy的反驳。"},{"time":"00:03:42,000 --> 00:03:45,000","html":"<strong>Tutor:<\/strong> Anyway, is there anything else I can help with?","cn":"总之，还有什么我能帮助你的吗？","analysis":""},{"time":"00:03:45,000 --> 00:03:48,000","html":"<strong>Tutor:<\/strong> Any practical information about <mark style=\"background-color: #fecaca;\">layout<\/mark> perhaps?","cn":"比如有关<mark style=\"background-color: #fecaca;\">版式<\/mark>的实用信息？","analysis":""},{"time":"00:03:48,000 --> 00:03:55,000","html":"<strong>Kathy:<\/strong> Well, I suppose I'm a bit unsure about how the <mark style=\"background-color: #fecaca;\">bibliography<\/mark> should be presented.","cn":"嗯，我确实有点不确定<mark style=\"background-color: #fecaca;\">参考书目<\/mark>应该怎样呈现。","analysis":""},{"time":"00:03:55,000 --> 00:03:59,000","html":"<strong>Kathy:<\/strong> Like you, I can just check what's normally done in journal articles.","cn":"不过，我可以查看期刊文章通常采用的格式。","analysis":""},{"time":"00:03:59,000 --> 00:04:02,000","html":"<strong>Kathy:<\/strong> So that's not something to bother you with.","cn":"所以这件事不用麻烦你。","analysis":""},{"time":"00:04:02,000 --> 00:04:09,000","html":"<strong>Kathy:<\/strong> I'd welcome some guidance though about what I should or shouldn't include in the <mark style=\"background-color: #bbf7d0;\">appendices<\/mark>.","cn":"但关于<mark style=\"background-color: #bbf7d0;\">附录<\/mark>中应该或不应该包括什么，我希望得到一些指导。","analysis":""},{"time":"00:04:09,000 --> 00:04:11,000","html":"<strong>Kathy:<\/strong> I know some things.","cn":"我知道有些内容，","analysis":""},{"time":"00:04:11,000 --> 00:04:16,000","html":"<strong>Kathy:<\/strong> Some of my data tables or details of specs perhaps","cn":"例如我的某些数据表或技术规格细节，","analysis":""},{"time":"00:04:16,000 --> 00:04:19,000","html":"<strong>Kathy:<\/strong> are not really needed in the main body of the text","cn":"其实不需要放在正文中，","analysis":""},{"time":"00:04:19,000 --> 00:04:22,000","html":"<strong>Kathy:<\/strong> and I'm likely to be pushed for words there.","cn":"而且正文很可能受到字数限制。","analysis":""},{"time":"00:04:22,000 --> 00:04:25,000","html":"<strong>Tutor:<\/strong> Okay, I can certainly help you with that.","cn":"好的，这方面我当然可以帮助你。","analysis":"<strong>答案解析：<\/strong>第25题选 <strong>C<\/strong>。Kathy表示自己能查期刊解决参考书目格式，但希望导师指导附录应收录哪些内容。"},{"time":"00:04:25,000 --> 00:04:29,000","html":"<strong>Tutor:<\/strong> But it will take a while, so can we deal with that next week?","cn":"但这需要一些时间，我们下周再处理可以吗？","analysis":""},{"time":"00:04:29,000 --> 00:04:33,000","html":"<strong>Tutor:<\/strong> I've got that <mark style=\"background-color: #fecaca;\">solar panel seminar<\/mark> to go into in a few minutes.","cn":"几分钟后我要去参加那个<mark style=\"background-color: #fecaca;\">太阳能电池板研讨会<\/mark>。","analysis":""},{"time":"00:04:33,000 --> 00:04:36,000","html":"<strong>Tutor:<\/strong> There's plenty of work you can be carrying on within the meantime.","cn":"与此同时，你还有很多工作可以继续做。","analysis":""},{"time":"00:04:36,000 --> 00:04:38,000","html":"<strong>Kathy:<\/strong> Sure, that's no problem.","cn":"当然，没问题。","analysis":""},{"time":"00:04:38,000 --> 00:04:43,000","html":"<strong>Kathy:<\/strong> I think I'll go and investigate the <mark style=\"background-color: #bbf7d0;\">latest version of the CAD software<\/mark>","cn":"我想去研究一下<mark style=\"background-color: #bbf7d0;\">最新版CAD软件<\/mark>，","analysis":""},{"time":"00:04:43,000 --> 00:04:47,000","html":"<strong>Kathy:<\/strong> to see if it might help with my pump design experiments at all.","cn":"看看它是否能对我的水泵设计实验有所帮助。","analysis":"<strong>答案解析：<\/strong>第26题选 <strong>A<\/strong>。Kathy接下来要研究最新版CAD软件，看看能否帮助水泵设计实验。太阳能研讨会是导师要参加的。"},{"time":"00:04:50,000 --> 00:04:53,000","html":"<strong>Narrator:<\/strong> Before you hear the rest of the discussion,","cn":"在继续听讨论的其余部分之前，","analysis":""},{"time":"00:04:53,000 --> 00:04:58,000","html":"<strong>Narrator:<\/strong> you have some time to look at questions 27 to 30.","cn":"你有一些时间浏览第27至第30题。","analysis":""},{"time":"00:05:08,000 --> 00:05:28,000","html":"<strong>Narrator:<\/strong> Now listen and answer questions 27 to 30.","cn":"现在请听录音并回答第27至第30题。","analysis":""},{"time":"00:05:28,000 --> 00:05:31,000","html":"<strong>Tutor:<\/strong> Before you go though, I'd like quickly to run through","cn":"不过在你走之前，我想快速说明一下","analysis":""},{"time":"00:05:31,000 --> 00:05:34,000","html":"<strong>Tutor:<\/strong> what you should be doing over the next few months,","cn":"接下来几个月你应该做些什么，","analysis":""},{"time":"00:05:34,000 --> 00:05:36,000","html":"<strong>Tutor:<\/strong> not just for your dissertation,","cn":"不仅是为了毕业论文，","analysis":""},{"time":"00:05:36,000 --> 00:05:40,000","html":"<strong>Tutor:<\/strong> but also to help your chances of getting the research post you'd like.","cn":"也为了增加你获得理想研究职位的机会。","analysis":""},{"time":"00:05:40,000 --> 00:05:42,000","html":"<strong>Tutor:<\/strong> Is that okay with you?","cn":"你愿意听吗？","analysis":""},{"time":"00:05:42,000 --> 00:05:44,000","html":"<strong>Kathy:<\/strong> Yes, that would be really helpful.","cn":"愿意，这会非常有帮助。","analysis":""},{"time":"00:05:44,000 --> 00:05:49,000","html":"<strong>Tutor:<\/strong> Well, you certainly need to become a member of the Mechanical Engineers Society","cn":"你当然需要成为机械工程师学会的会员，","analysis":""},{"time":"00:05:49,000 --> 00:05:53,000","html":"<strong>Tutor:<\/strong> and then you'll be able to go along to their meetings.","cn":"这样就可以参加他们的会议。","analysis":""},{"time":"00:05:53,000 --> 00:05:57,000","html":"<strong>Tutor:<\/strong> There you must make a point of <mark style=\"background-color: #bbf7d0;\">making yourself known to various people<\/mark>","cn":"在那里，你一定要<mark style=\"background-color: #bbf7d0;\">主动让各种人士认识你<\/mark>，","analysis":""},{"time":"00:05:57,000 --> 00:05:59,000","html":"<strong>Tutor:<\/strong> like Professor Jones.","cn":"例如Jones教授。","analysis":""},{"time":"00:05:59,000 --> 00:06:03,000","html":"<strong>Tutor:<\/strong> He's the current president and is very approachable.","cn":"他是现任会长，而且非常平易近人。","analysis":""},{"time":"00:06:03,000 --> 00:06:06,000","html":"<strong>Kathy:<\/strong> Okay, so I could do some <mark style=\"background-color: #bbf7d0;\">networking<\/mark> there.","cn":"好的，所以我可以在那里<mark style=\"background-color: #bbf7d0;\">建立人脉<\/mark>。","analysis":""},{"time":"00:06:06,000 --> 00:06:07,000","html":"<strong>Tutor:<\/strong> Exactly.","cn":"正是如此。","analysis":"<strong>答案解析：<\/strong>第27题选 <strong>F<\/strong>。参加机械工程师学会会议可以认识教授等人士、建立人脉，即获得有用联系人。"},{"time":"00:06:07,000 --> 00:06:11,000","html":"<strong>Tutor:<\/strong> Also, I think you should try to set up some visits to industry.","cn":"另外，我认为你应该安排一些行业参观。","analysis":""},{"time":"00:06:11,000 --> 00:06:16,000","html":"<strong>Tutor:<\/strong> Go to a lot of <mark style=\"background-color: #bbf7d0;\">different workplaces<\/mark> just to see how things are done.","cn":"去许多<mark style=\"background-color: #bbf7d0;\">不同的工作场所<\/mark>，看看实际工作是怎样完成的。","analysis":""},{"time":"00:06:16,000 --> 00:06:19,000","html":"<strong>Tutor:<\/strong> It's actually a very good way of <mark style=\"background-color: #bbf7d0;\">making sure you're familiar<\/mark>","cn":"这其实是<mark style=\"background-color: #bbf7d0;\">确保自己熟悉<\/mark>","analysis":""},{"time":"00:06:19,000 --> 00:06:22,000","html":"<strong>Tutor:<\/strong> with the <mark style=\"background-color: #bbf7d0;\">cutting edge<\/mark> of what's going on.","cn":"该领域<mark style=\"background-color: #bbf7d0;\">最新发展状况<\/mark>的一种很好方法。","analysis":""},{"time":"00:06:22,000 --> 00:06:28,000","html":"<strong>Tutor:<\/strong> Textbooks, even academic articles, sometimes lag behind industry.","cn":"教科书，甚至学术文章，有时会落后于行业。","analysis":"<strong>答案解析：<\/strong>第28题选 <strong>C<\/strong>。参观不同工作场所能了解行业最前沿，而教材和论文可能滞后，因此这是保持知识更新的有效方式。"},{"time":"00:06:28,000 --> 00:06:31,000","html":"<strong>Kathy:<\/strong> That sounds really interesting.","cn":"听起来很有意思。","analysis":""},{"time":"00:06:31,000 --> 00:06:35,000","html":"<strong>Kathy:<\/strong> Also, I'd love the chance to do a bit of work abroad for a while.","cn":"我也很想有机会去国外工作一段时间。","analysis":""},{"time":"00:06:35,000 --> 00:06:39,000","html":"<strong>Tutor:<\/strong> Well, that's actually the next thing I was going to recommend.","cn":"这正是我接下来准备建议的事情。","analysis":""},{"time":"00:06:39,000 --> 00:06:44,000","html":"<strong>Tutor:<\/strong> I'm sure we could set up a month for you in either the <mark style=\"background-color: #bbf7d0;\">States or Canada<\/mark>,","cn":"我相信我们可以安排你去<mark style=\"background-color: #bbf7d0;\">美国或加拿大<\/mark>待一个月，","analysis":""},{"time":"00:06:44,000 --> 00:06:48,000","html":"<strong>Tutor:<\/strong> and that would be a great way to <mark style=\"background-color: #bbf7d0;\">find out how things are done elsewhere<\/mark>.","cn":"这是<mark style=\"background-color: #bbf7d0;\">了解其他地方如何开展工作<\/mark>的好方法。","analysis":"<strong>答案解析：<\/strong>第29题选 <strong>A<\/strong>。去美国或加拿大工作一个月可以了解其他地方的实际工作方式，拓宽该领域的实践经验。"},{"time":"00:06:48,000 --> 00:06:49,000","html":"<strong>Kathy:<\/strong> That would be good.","cn":"那会很不错。","analysis":""},{"time":"00:06:49,000 --> 00:06:50,000","html":"<strong>Kathy:<\/strong> Thank you.","cn":"谢谢。","analysis":""},{"time":"00:06:50,000 --> 00:06:56,000","html":"<strong>Tutor:<\/strong> And the last thing I was going to suggest was that you could go to the European Water Engineering Conference","cn":"最后，我还想建议你参加五月在西班牙举行的欧洲水利工程会议，","analysis":""},{"time":"00:06:56,000 --> 00:06:58,000","html":"<strong>Tutor:<\/strong> being held in Spain in May.","cn":"会议将在西班牙举行。","analysis":""},{"time":"00:06:58,000 --> 00:07:01,000","html":"<strong>Kathy:<\/strong> I could even <mark style=\"background-color: #bbf7d0;\">present my dissertation<\/mark> there.","cn":"我甚至可以在那里<mark style=\"background-color: #bbf7d0;\">展示我的毕业论文<\/mark>。","analysis":""},{"time":"00:07:01,000 --> 00:07:02,000","html":"<strong>Tutor:<\/strong> Yes.","cn":"对。","analysis":"<strong>答案解析：<\/strong>第30题选 <strong>B<\/strong>。参加国际会议时，Kathy可以展示自己的毕业论文，从而宣传自己的研究成果。"},{"time":"00:07:02,000 --> 00:07:05,000","html":"<strong>Kathy:<\/strong> Thank you so much. That's all really helpful.","cn":"非常感谢，这些建议真的都很有帮助。","analysis":""},{"time":"00:07:05,000 --> 00:07:06,000","html":"<strong>Tutor:<\/strong> Good.","cn":"很好。","analysis":""},{"time":"00:07:11,000 --> 00:07:13,000","html":"<strong>Narrator:<\/strong> That is the end of part three.","cn":"第三部分到此结束。","analysis":""},{"time":"00:07:13,000 --> 00:07:19,000","html":"<strong>Narrator:<\/strong> You now have 30 seconds to check your answers to part three.","cn":"现在你有30秒时间检查第三部分的答案。","analysis":""}],"transcriptHighlights":[{"qid":"21","text":"her introductory chapter","answer":"B"},{"qid":"22","text":"the organisation","answer":"A"},{"qid":"23","text":"record more data","answer":"B"},{"qid":"24","text":"to encourage Kathy to do something similar","answer":"C"},{"qid":"25","text":"appendices.","answer":"C"},{"qid":"26","text":"try out some software","answer":"A"},{"qid":"27","text":"way to make useful contacts","answer":"F"},{"qid":"28","text":"effective way of keeping up-to-date","answer":"C"},{"qid":"29","text":"broadens practical experience of the field","answer":"A"},{"qid":"30 <script>
const DATA=JSON.parse(document.getElementById('test-data').textContent);const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];const RENDER_VERSION=17;
let secs=0,review=false,timer=setInterval(()=>{secs++;drawTimer();if(secs%5===0)save(false)},1000),drag=null,currentCue=-1,loopCue=false,slowCue=false,showCn=true,showAnalysis=true,dictationMode=false,showOriginal=true,dictationAnswers={};const storeKey='ielts_v4_'+DATA.title.replace(/\W+/g,'_');
const CONFIG_DATA={answerKey:DATA.answerKey,questionList:DATA.questionIds.map(q=>Number(q)||q),localStorageKey:storeKey};window.localStorageKey=storeKey;window.DATA=DATA;window.CONFIG_DATA=CONFIG_DATA;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function matchingRepeatAttr(g){return (g.questions||[]).length>(g.options||[]).length?' data-repeat="true"':''}
function flowQuestionMap(g){let map={};(g.questions||[]).forEach(q=>map[q[0]]=q[1]);return map}
function flowQidsInText(raw,qmap){return Object.keys(qmap).filter(id=>new RegExp(`(?<!\\d)${id}(?!\\d)`).test(raw)).sort((a,b)=>Number(a)-Number(b))}
function renderFlowText(raw,qids){qids=Array.isArray(qids)?qids:[qids];let html=esc(String(raw||''));qids.forEach(qid=>{html=html.replace(new RegExp(`(?<!\\d)${qid}(?!\\d)`),`<span class="flow-num">${qid}</span>`)});let slotIdx=0;html=html.replace(/(?:_{2,}|…{2,}|\.{4,})/g,()=>{let qid=qids[slotIdx++]||qids[qids.length-1];return `<span class="slot" data-q="${qid}"></span>`});qids.slice(slotIdx).forEach(qid=>{html+=` <span class="slot" data-q="${qid}"></span>`});return html}
function renderFlowLine(line,qmap,used){let raw=String((typeof line==='object'&&line?line.text:line)||''),qids=flowQidsInText(raw,qmap);if(qids.length){qids.forEach(qid=>used.add(qid));return `<div class="flow-step flow-step-full"><div class="flow-text">${renderFlowText(raw,qids)}</div></div>`}return `<div class="flow-note">${esc(raw)}</div>`}
function renderFlowTable(lines,qmap,used){let rows=[],maxCols=1;lines.forEach(line=>{let meta=typeof line==='object'&&line?line:{},row=Number(meta.row)||0,col=Number(meta.col)||0,cols=Number(meta.cols)||1,raw=String(meta.text||''),qids=flowQidsInText(raw,qmap);maxCols=Math.max(maxCols,cols,col+1);if(!rows[row])rows[row]=[];if(!rows[row][col])rows[row][col]=[];qids.forEach(qid=>used.add(qid));rows[row][col].push(`<div class="flow-text">${qids.length?renderFlowText(raw,qids):esc(raw)}</div>`)});return `<div class="flow-table-wrap"><table class="flow-table">${rows.map(cells=>{let filled=(cells||[]).map((parts,col)=>parts?{col,html:parts.join('')}:null).filter(Boolean);return `<tr>${filled.map(cell=>{let span=filled.length===1&&maxCols>1?` colspan="${maxCols}"`:'';return `<td${span}>${cell.html}</td>`}).join('')}</tr>`}).join('')}</table></div>`}
function renderFlowSteps(g){let qmap=flowQuestionMap(g),used=new Set(),lines=(g.bodyLines&&g.bodyLines.length?g.bodyLines:[]);if(lines.length){let html='',i=0;while(i<lines.length){let meta=typeof lines[i]==='object'&&lines[i]?lines[i]:{};if(meta.table){let table=meta.table,chunk=[];while(i<lines.length){let m=typeof lines[i]==='object'&&lines[i]?lines[i]:{};if(m.table!==table)break;chunk.push(lines[i++])}html+=renderFlowTable(chunk,qmap,used);continue}html+=renderFlowLine(lines[i++],qmap,used)}return html+(g.questions||[]).filter(q=>!used.has(q[0])).map(q=>`<div class="flow-step"><div class="flow-num">${q[0]}</div><div class="flow-text">${esc(q[1])}</div><span class="slot" data-q="${q[0]}"></span></div>`).join('')}return g.questions.map((q,idx)=>`<div class="flow-step"><div class="flow-num">${q[0]}</div><div class="flow-text">${esc(q[1])}</div><span class="slot" data-q="${q[0]}"></span></div>${idx<g.questions.length-1?'<div class="flow-arrow">↓</div>':''}`).join('')}
function groupHTML(g){if(g.type==='matching'&&g.layout==='flow')return `<section class="group"${matchingRepeatAttr(g)}><h3>${esc(g.title)}</h3><div class="instruction">${esc(g.instruction)}</div><div class="flow-layout"><div class="flow-steps">${renderFlowSteps(g)}</div><div><strong>${esc(g.optionsTitle||'Options')}</strong><div class="pool">${g.options.map(o=>`<div class="drag" draggable="true" data-value="${o[0]}">${o[0]} ${esc(o[1])}</div>`).join('')}</div></div></div></section>`;
if(g.type==='matching'&&g.layout==='diagram')return `<section class="group"${matchingRepeatAttr(g)}><h3>${esc(g.title)}</h3><div class="instruction">${esc(g.instruction)}</div><div class="map-layout"><div class="map-image"><img src="${esc(g.image||'diagram.png')}" alt="Diagram"></div><div class="matching"><div>${g.questions.map(q=>`<div class="match-row"><strong>${q[0]}</strong><span>${esc(q[1])}</span><span class="slot" data-q="${q[0]}"></span></div>`).join('')}</div><div><strong>${esc(g.optionsTitle||'Options')}</strong><div class="pool">${g.options.map(o=>`<div class="drag" draggable="true" data-value="${o[0]}">${o[0]} ${esc(o[1])}</div>`).join('')}</div></div></div></div></section>`;
if(g.type==='matching')return `<section class="group"${matchingRepeatAttr(g)}><h3>${esc(g.title)}</h3><div class="instruction">${esc(g.instruction)}</div><div class="matching"><div>${g.questions.map(q=>`<div class="match-row"><strong>${q[0]}</strong><span>${esc(q[1])}</span><span class="slot" data-q="${q[0]}"></span></div>`).join('')}</div><div><strong>${esc(g.optionsTitle||'Options')}</strong><div class="pool">${g.options.map(o=>`<div class="drag" draggable="true" data-value="${o[0]}">${o[0]} ${esc(o[1])}</div>`).join('')}</div></div></div></section>`;
if(g.type==='map')return `<section class="group"><h3>${esc(g.title)}</h3><div class="instruction">${esc(g.instruction)}</div><div class="map-layout"><div class="map-image"><img src="${esc(g.image||'map.png')}" alt="Map" onerror="if(this.dataset.fallback!=='1'){this.dataset.fallback='1';this.src='diagram.png'}"></div><div class="map-grid"><div class="map-answer-list">${g.questions.map(q=>`<div class="map-row"><div class="map-row-label"><strong>${q[0]}</strong> ${esc(q[1]||'')}</div><div class="map-options" style="--map-options:${(g.options||[]).length||1}">${(g.options||[]).map(o=>`<div class="choice map-choice" data-name="q${q[0]}" data-value="${o}">${o}</div>`).join('')}</div></div>`).join('')}</div></div></div></section>`;
if(g.type==='single')return `<section class="group"><h3>${esc(g.title)}</h3><div class="instruction">${esc(g.instruction)}</div>${g.questions.map(q=>`<p><strong>${q.id}</strong> ${esc(q.text)}</p>${q.options.map(o=>`<div class="choice single-choice" data-name="q${q.id}" data-value="${o[0]}">${o[0]} ${esc(o[1])}</div>`).join('')}`).join('')}</section>`;
if(g.type==='multiple')return `<section class="group" data-limit="${g.limit}" data-id="${g.id}"><h3>${esc(g.title)}</h3><div class="instruction">${esc(g.instruction)}</div><p><strong>${esc(g.id)}</strong> ${esc(g.questionText)}</p>${g.options.map(o=>`<div class="choice multi-choice" data-name="q${g.id.replace('-','_')}" data-value="${o[0]}">${o[0]} ${esc(o[1])}</div>`).join('')}</section>`;
return `<section class="group"><h3>${esc(g.title)}</h3>${renderFillGroup(g)}</section>`}
function renderFillGroup(g){let qids=(g.questions||[]).map(q=>String(q.id));let used=new Set();let lines=(g.bodyLines&&g.bodyLines.length?g.bodyLines:g.questions.map(q=>`${q.id} ${q.text} _____`));let html='',i=0;while(i<lines.length){let meta=typeof lines[i]==='object'&&lines[i]?lines[i]:{};if(meta.table){let table=meta.table,chunk=[];while(i<lines.length){let m=typeof lines[i]==='object'&&lines[i]?lines[i]:{};if(m.table!==table)break;chunk.push(lines[i++])}html+=renderFillTable(chunk,qids,used);continue}html+=renderFillLine(lines[i++],qids,used)}return html||`<div class="instruction">${esc(g.instruction||'Complete the notes below.')}</div>`}
function renderFillTable(lines,qids,used){let rows=[],maxCols=1;lines.forEach(line=>{let meta=typeof line==='object'&&line?line:{},row=Number(meta.row)||0,col=Number(meta.col)||0,cols=Number(meta.cols)||1;maxCols=Math.max(maxCols,cols,col+1);if(!rows[row])rows[row]=[];if(!rows[row][col])rows[row][col]=[];rows[row][col].push(`<div class="fill-table-line">${renderFillLine(line,qids,used,true)}</div>`)});return `<div class="fill-table-wrap"><table class="fill-table">${rows.map((cells,idx)=>{let filled=(cells||[]).map((parts,col)=>parts?{col,html:parts.join('')}:null).filter(Boolean);return `<tr>${filled.map(cell=>{let tag=idx===0?'th':'td',span=filled.length===1&&maxCols>1?` colspan="${maxCols}"`:'';return `<${tag}${span}>${cell.html}</${tag}>`}).join('')}</tr>`}).join('')}</table></div>`}
function fillInput(qid,lead=''){return `<span class="blank-q">${esc(qid)}</span>${esc(lead)}<input class="blank" name="q${esc(qid)}" type="text" autocomplete="off" inputmode="text">`}
function fillLineAttrs(meta,isHeading){let cls=['doc-line'];if(isHeading)cls.push('fill-heading');if(meta.list)cls.push('is-list');let rawLevel=Math.max(0,Math.min(6,Number(meta.level)||0)),level=rawLevel>0?rawLevel+1:rawLevel;let style=meta.list?` style="--indent:${level*30}px"`:'';return `class="${cls.join(' ')}"${style}`}
function fillLineContent(meta,body){let level=Math.max(0,Number(meta.level)||0),bullet=level>0?'◦':'•';return meta.list?`<span class="doc-bullet">${bullet}</span><span class="doc-line-content">${body}</span>`:body}
function isFillHeading(raw,meta,hit){return !hit&&!meta.list&&!/(?:_{2,}|…{2,}|\.{4,})/.test(raw)&&!/^\d+\.?\s+/.test(raw)&&!/^(?:Complete|Write|Choose)\b/i.test(raw)}
function renderFillLine(line,qids,used,inner=false){let meta=typeof line==='object'&&line?line:{},raw=String(meta.text??line),html=esc(raw),hit=false;html=html.replace(/(^|[^\d])(\d{1,2})\.?\s*((?:£\s*)?)(?:_{2,}|…{2,}|\.{4,})/g,(m,prefix,qid,lead)=>{if(!qids.includes(qid))return m;used.add(qid);hit=true;return prefix+fillInput(qid,lead)});let m=raw.match(/^(\d+)\.?\s+(.+)$/);if(!hit&&m&&qids.includes(m[1])){used.add(m[1]);let body=esc(m[2]);let input=fillInput(m[1]);body=/(?:_+|…{2,}|\.{4,})/.test(body)?body.replace(/(?:_+|…{2,}|\.{4,})/,input):`${body} ${input}`;return inner?fillLineContent(meta,body):`<p ${fillLineAttrs(meta,false)}>${fillLineContent(meta,body)}</p>`}return inner?html:`<p ${fillLineAttrs(meta,isFillHeading(raw,meta,hit))}>${fillLineContent(meta,html)}</p>`}
function hardResetAnswers(){$$('input').forEach(i=>{i.value='';i.defaultValue=''});$$('.choice').forEach(c=>c.classList.remove('selected'));$$('.slot').forEach(s=>s.innerHTML='');refreshPool();updateNav()}
function render(){document.title=DATA.title;$('#ownerMeta').textContent=DATA.ownerInfo||'';$('#audio').src=DATA.audio||'audio.mp3';$('#content').innerHTML=DATA.groups.map(groupHTML).join('');$('#nav').innerHTML=DATA.questionIds.map(q=>`<div data-q="${q}">${q}</div>`).join('');bindDynamic();hardResetAnswers();load();updateNav()}
function bindDynamic(){
  $$('#content input').forEach(i=>{i.oninput=()=>{updateNav();save(false)};i.onchange=()=>{updateNav();save(false)}});
  $$('.single-choice').forEach(btn=>btn.onclick=e=>{if(review||window.getSelection().toString())return;$$(`.single-choice[data-name="${btn.dataset.name}"]`).forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');updateNav();save(false)});
  $$('.map-choice').forEach(btn=>btn.onclick=e=>{if(review||window.getSelection().toString())return;$$(`.map-choice[data-name="${btn.dataset.name}"]`).forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');updateNav();save(false)});
  $$('.multi-choice').forEach(btn=>btn.onclick=e=>{if(review||window.getSelection().toString())return;let group=btn.closest('.group'),limit=Number(group?.dataset.limit||99),name=btn.dataset.name,selected=$$(`.multi-choice[data-name="${name}"].selected`);if(!btn.classList.contains('selected')&&selected.length>=limit)return;btn.classList.toggle('selected');updateNav();save(false)});
  $$('#nav [data-q]').forEach(n=>n.onclick=()=>scrollToQuestion(n.dataset.q));
}
function bindGlobal(){
  document.addEventListener('dragstart',e=>{let d=e.target.closest('.drag,.tag');if(!d||review)return;drag={value:d.dataset.value,text:d.textContent,from:d.closest('.slot')};});

  document.addEventListener('drop',e=>{let slot=e.target.closest('.slot'),pool=e.target.closest('.pool');if(!drag||review)return;e.preventDefault();if(pool&&drag.from){drag.from.innerHTML='';refreshPool();updateNav();save(false);return}if(slot){if(drag.from)drag.from.innerHTML='';slot.innerHTML=`<span class="tag" draggable="true" data-value="${drag.value}">${esc(drag.text)}</span>`;refreshPool();updateNav();save(false)}});
  document.addEventListener('mouseup',handleSelection);
  $('#selbar').onclick=handleToolbar;
}
function scrollToQuestion(q){let first=q.split('-')[0];let target=$(`input[name="q${first}"], .slot[data-q="${first}"], .choice[data-name="q${first}"]`)||$(`input[name="q${q.replace('-','_')}"]`);target?.closest('.group')?.scrollIntoView({behavior:'smooth',block:'center'});}
function refreshPool(){$$('.group').forEach(g=>{let slots=[...g.querySelectorAll('.slot')],drags=[...g.querySelectorAll('.drag')],repeat=g.dataset.repeat==='true'||slots.length>drags.length,used=new Set(slots.map(s=>s.querySelector('.tag')?.dataset.value).filter(Boolean));drags.forEach(d=>d.classList.toggle('hidden',!repeat&&used.has(d.dataset.value)))})}
function restoreDragging(){drag=null;$$('.drag,.tag').forEach(d=>d.draggable=!review)}
function multipleGroupFor(q){let n=Number(q);return DATA.groups.find(g=>{if(g.type!=='multiple')return false;let [a,b]=g.id.split('-').map(Number);return n>=a&&n<=b})}
function multipleNameFor(q){let g=multipleGroupFor(q);return g?'q'+g.id.replace('-','_'):null}

function norm(s){return String(s).normalize('NFKC').trim().replace(/[А]/g,'A').replace(/[В]/g,'B').replace(/[Е]/g,'E').replace(/[Н]/g,'H').replace(/[К]/g,'K').replace(/[М]/g,'M').replace(/[О]/g,'O').replace(/[Р]/g,'P').replace(/[С]/g,'C').replace(/[Т]/g,'T').replace(/[Х]/g,'X').replace(/[а]/g,'a').replace(/[е]/g,'e').replace(/[о]/g,'o').replace(/[р]/g,'p').replace(/[с]/g,'c').replace(/[х]/g,'x').toLowerCase().replace(/[‘’`´]/g,"'").replace(/'/g,'').replace(/\s+/g,' ')}function answerVariants(s){return String(s||'').split(/\s*\/\s*/).map(x=>x.trim()).filter(Boolean)}function rangeIds(id){let [a,b]=id.split('-').map(Number),out=[];for(let n=a;n<=b;n++)out.push(String(n));return out}function multipleCorrectSetFor(q){let g=multipleGroupFor(q);if(!g)return null;let vals=DATA.answerKey.multiple?.['q'+g.id.replace('-','_')]||[];return new Set(vals.flatMap(v=>answerVariants(v)).map(v=>norm(v)).filter(Boolean))}function isCorrect(q){let user=norm(getAnswer(q));let multiSet=multipleCorrectSetFor(q);if(multiSet)return !!user&&multiSet.has(user);return answerVariants(correctAnswer(q)).some(ans=>user===norm(ans))}

function questionInText(q,text){let n=Number(String(q).replace(/\D/g,""));if(!n||!text)return false;let raw=String(text).replace(/&nbsp;/g," ");let direct=new RegExp("(?:问题|Question|Q)\\s*0?"+n+"(?!\\d)|第\\s*0?"+n+"\\s*题|(?<!\\d)0?"+n+"\\s*题","i").test(raw)||new RegExp("(?:data-question=[\"']?|class=[\"'][^\"']*q)0?"+n+"(?!\\d)","i").test(raw);if(direct)return true;let re=/(?:问题|Question|Q|第)?\s*(\d+)\s*(?:-|–|—|至|到|和|and|to|&)\s*(\d+)\s*题?/gi,m;while((m=re.exec(raw))){let a=Number(m[1]),b=Number(m[2]);if(n>=Math.min(a,b)&&n<=Math.max(a,b))return true}return false}

function highlightTerms(){let terms=[];for(let item of DATA.transcriptHighlights||[]){let text=typeof item==='string'?item:item.text;if(text){terms.push(String(text));String(text).split(/\s+/).map(w=>w.replace(/[^A-Za-z0-9'-]/g,'')).filter(w=>w.length>=5&&!/^(which|three|answer|letter|about|their|there|would|could|should)$/i.test(w)).forEach(w=>terms.push(w))}}return [...new Set(terms.map(t=>t.trim()).filter(t=>t.length>1))].sort((a,b)=>b.length-a.length)}

function load(){let raw=localStorage.getItem(storeKey);if(!raw)return;let d;try{d=JSON.parse(raw)}catch(err){console.warn('Saved progress could not be read.',err);return}secs=d.secs||0;if(d.answers){try{restoreAnswers(d.answers)}catch(err){console.warn('Saved answers could not be restored.',err)}}if(d.dictationAnswers)dictationAnswers=d.dictationAnswers;if(d.studyState)try{({currentCue=currentCue,loopCue=loopCue,slowCue=slowCue,showCn=showCn,showAnalysis=showAnalysis,dictationMode=dictationMode,showOriginal}=d.studyState)}catch(err){console.warn('Study state could not be restored.',err)}if(d.notes){try{$('#notesList').innerHTML=d.notes;$$('#notesList textarea').forEach(t=>{t.value=t.dataset.value||t.textContent||''})}catch(err){console.warn('Saved notes could not be restored.',err)}}if(d.dark)document.body.classList.add('dark');setFontSize(d.font||DEFAULT_FONT_SIZE,false);if(d.audioTime)audio.addEventListener('loadedmetadata',()=>{audio.currentTime=d.audioTime},{once:true});bindNoteDeletes();drawTimer()}
function handleSelection(e){if(e.target.closest('#selbar,#notes,.bottom-bar'))return;let sel=window.getSelection();let hl=e.target.closest?.('.hl-brown,.hl-rose,.hl-blue');let bar=$('#selbar');if(hl&&sel.isCollapsed){bar.targetElem=hl;placeBar(bar,hl.getBoundingClientRect())}else if(sel&&!sel.isCollapsed&&$('#content').contains(sel.anchorNode)){bar.targetElem=null;placeBar(bar,sel.getRangeAt(0).getBoundingClientRect())}else{bar.hidden=true}}
function placeBar(bar,rect){bar.hidden=false;bar.style.left=Math.max(8,window.scrollX+rect.left+rect.width/2-95)+'px';bar.style.top=Math.max(8,window.scrollY+rect.top-46)+'px'}
function highlightedFromSelection(){let sel=window.getSelection();if(!sel||sel.isCollapsed)return null;let node=sel.anchorNode?.nodeType===3?sel.anchorNode.parentElement:sel.anchorNode;return node?.closest?.('.hl-brown,.hl-rose,.hl-blue')||null}
function handleToolbar(e){let act=e.target.closest('button')?.dataset.act;if(!act)return;let bar=$('#selbar'),target=bar.targetElem||highlightedFromSelection(),sel=window.getSelection();if(act==='del'&&target){unwrap(target);removeNote(target.dataset.hid)}else if(act==='hl'){if(target){if(target.classList.contains('hl-brown'))target.className='hl-rose';else if(target.classList.contains('hl-rose'))target.className='hl-rose';else target.className='hl-brown'}else{let span=wrapSelection('hl-brown');if(span)span.dataset.hid='h_'+Date.now()}}else if(act==='note'){let span=target||wrapSelection('hl-blue');if(span){span.className='hl-blue';if(!span.dataset.hid)span.dataset.hid='n_'+Date.now();createNote(span);document.body.classList.add('notes-open')}}bar.hidden=true;sel.removeAllRanges();save(false)}
function wrapSelection(cls){let sel=window.getSelection();if(!sel||sel.isCollapsed)return null;let range=sel.getRangeAt(0);if(!$('#content').contains(range.commonAncestorContainer))return null;let span=document.createElement('span');span.className=cls;try{range.surroundContents(span)}catch{span.appendChild(range.extractContents());range.insertNode(span)}return span}
function unwrap(el){let p=el.parentNode;if(!p)return;while(el.firstChild)p.insertBefore(el.firstChild,el);p.removeChild(el);p.normalize()}
function clearUserHighlights(){$$('.hl-brown,.hl-rose,.hl-blue').forEach(unwrap)}
function createNote(span){let id=span.dataset.hid;if($(`.note-card[data-hid="${id}"]`))return;let card=document.createElement('div');card.className='note-card';card.dataset.hid=id;card.innerHTML=`<div class="note-quote">${esc(span.textContent.slice(0,120))}</div><textarea placeholder="Write note here..."></textarea><button class="delete-note" type="button">Delete</button>`;$('#notesList').prepend(card);bindNoteDeletes()}
function bindNoteDeletes(){$$('#notesList textarea').forEach(t=>t.oninput=()=>save(false));$$('.delete-note').forEach(btn=>btn.onclick=()=>{let card=btn.closest('.note-card'),id=card.dataset.hid,span=$(`[data-hid="${id}"]`);if(span)unwrap(span);card.remove();save(false)})}
function removeNote(id){if(!id)return;$(`.note-card[data-hid="${id}"]`)?.remove()}
function drawTimer(){let m=Math.floor(secs/60),s=secs%60;$('#timer').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
const DEFAULT_FONT_SIZE=16,MIN_FONT_SIZE=14,MAX_FONT_SIZE=22;
function currentFontSize(){return Number.parseInt(document.documentElement.style.fontSize,10)||DEFAULT_FONT_SIZE}
function setFontSize(size,persist=true){let n=Math.max(MIN_FONT_SIZE,Math.min(MAX_FONT_SIZE,Number(size)||DEFAULT_FONT_SIZE));document.documentElement.style.fontSize=n===DEFAULT_FONT_SIZE?'':n+'px';updateSizeButtons();if(persist)save(false)}
function adjustFontSize(delta){setFontSize(currentFontSize()+delta,true)}
function updateSizeButtons(){let size=currentFontSize(),dark=document.body.classList.contains('dark');$('#fontMinus')?.toggleAttribute('disabled',size<=MIN_FONT_SIZE);$('#fontPlus')?.toggleAttribute('disabled',size>=MAX_FONT_SIZE);$('#fontDefault')?.classList.toggle('active',size===DEFAULT_FONT_SIZE);$('#lightBtn')?.classList.toggle('active',!dark);$('#darkBtn')?.classList.toggle('active',dark)}
function resetAppearance(persist=true){document.body.classList.remove('dark');setFontSize(DEFAULT_FONT_SIZE,false);updateSizeButtons();if(persist)save(false)}
function clearAllProgress(){localStorage.removeItem(storeKey)}
$('#finish').onclick=finish;$('#save').onclick=()=>save(true);$('#clear').onclick=()=>{if(confirm('Clear all progress?')){window.resetTest();showToast('Clear complete')}};$('#toggleNotes').onclick=()=>{document.body.classList.toggle('notes-open');save(false)};$('#closeNotes').onclick=()=>{document.body.classList.remove('notes-open');save(false)};$('#toggleIntensive').onclick=()=>{toggleIntensive();save(false)};$('#settingsBtn').onclick=()=>{$('#settings').classList.toggle('open');updateSizeButtons()};$('#lightBtn').onclick=()=>{document.body.classList.remove('dark');updateSizeButtons();save(false)};$('#darkBtn').onclick=()=>{document.body.classList.add('dark');updateSizeButtons();save(false)};$('#appearanceReset').onclick=()=>resetAppearance(true);$('#fontMinus').onclick=()=>adjustFontSize(-1);$('#fontPlus').onclick=()=>adjustFontSize(1);$('#fontDefault').onclick=()=>setFontSize(DEFAULT_FONT_SIZE,true);$('#settings').addEventListener('wheel',e=>{e.preventDefault();adjustFontSize(e.deltaY>0?-1:1)},{passive:false});document.addEventListener('keydown',e=>{if(!e.ctrlKey&&!e.metaKey)return;let key=e.key;if(key==='+'||key==='='){e.preventDefault();adjustFontSize(1)}else if(key==='-'||key==='_'){e.preventDefault();adjustFontSize(-1)}else if(key==='0'){e.preventDefault();resetAppearance(true)}});
const audio=$('#audio');$('#play').onclick=()=>audio.paused?audio.play():audio.pause();audio.onplay=()=>$('#play').textContent='⏸';audio.onpause=()=>$('#play').textContent='▶';audio.ontimeupdate=()=>{if(audio.duration)$('#fillbar').style.width=(audio.currentTime/audio.duration*100)+'%';$('#time').textContent=`${Math.floor(audio.currentTime/60)}:${String(Math.floor(audio.currentTime%60)).padStart(2,'0')} / ${audio.duration?Math.floor(audio.duration/60):'00'}:${audio.duration?String(Math.floor(audio.duration%60)).padStart(2,'0'):'00'}`;maintainCueLoop()};$('#speed').onchange=e=>{slowCue=false;audio.playbackRate=+e.target.value;save(false)};$('#bar').onclick=e=>{if(audio.duration){let r=e.currentTarget.getBoundingClientRect();audio.currentTime=(e.clientX-r.left)/r.width*audio.duration;save(false)}};
bindGlobal();render();
</script>
</body>
