s":[{"id":"7","text":"Removal of some 7. ______"},{"id":"8","text":"8. ______ is too small"},{"id":"9","text":"9. ______"},{"id":"10","text":"Minimum length of lease: 10. ______"}],"bodyLines":[{"text":"Complete the note below","list":false,"level":0},{"text":"Write ONE WORD AND/OR A NUMBER in each question.","list":false,"level":0},{"text":"List of Requirements","list":false,"level":0},{"text":"Good lift access","list":true,"level":0},{"text":"Large lobby","list":true,"level":0},{"text":"Removal of some 7. ______","list":true,"level":0},{"text":"8. ______ is too small","list":true,"level":0},{"text":"Change office near entry to storeroom","list":true,"level":0},{"text":"New:","list":true,"level":0},{"text":"Paintwork","list":true,"level":1},{"text":"Lights","list":true,"level":1},{"text":"Blinds","list":true,"level":1},{"text":"9. ______","list":true,"level":1},{"text":"Minimum length of lease: 10. ______","list":true,"level":0}]}],"answerKey":{"text":{"q1":"Industries","q2":"Transport center/transport centre","q3":"12000/12,000","q4":"40/forty","q5":"Wheelchair","q6":"July","q7":"Walls","q8":"Kitchen","q9":"Carpet","q10":"3 years"},"single":{},"multiple":{},"multipleMap":{},"matching":{},"map":{}},"transcriptLines":[{"time":"00:00:00,000 --> 00:00:10,560","html":"<strong>Narrator:<\/strong> You will hear a conversation between a commercial property-letting agent and a businessman","cn":"<strong>旁白：<\/strong>你将听到一位商业地产租赁中介与一位商人的对话，","analysis":""},{"time":"00:00:10,560 --> 00:00:14,000","html":"<strong>Narrator:<\/strong> who wants to move his business to new premises.","cn":"<strong>旁白：<\/strong>这位商人想把公司搬到新的办公场所。","analysis":""},{"time":"00:00:14,000 --> 00:00:17,640","html":"<strong>Narrator:<\/strong> First, you have some time to look at questions 1 to 6.","cn":"<strong>旁白：<\/strong>首先，你有一些时间浏览第1至第6题。","analysis":""},{"time":"00:00:30,000 --> 00:00:46,160","html":"<strong>Narrator:<\/strong> Now we shall begin.","cn":"<strong>旁白：<\/strong>现在我们开始。","analysis":""},{"time":"00:00:46,160 --> 00:00:51,000","html":"<strong>Narrator:<\/strong> You should answer the questions as you listen, because you will not hear the recording","cn":"<strong>旁白：<\/strong>你应该边听边回答问题，因为录音","analysis":""},{"time":"00:00:51,000 --> 00:00:52,960","html":"<strong>Narrator:<\/strong> a second time.","cn":"<strong>旁白：<\/strong>不会播放第二遍。","analysis":""},{"time":"00:00:53,960 --> 00:00:58,960","html":"<strong>Narrator:<\/strong> And answer questions 1 to 6.","cn":"<strong>旁白：<\/strong>请回答第1至第6题。","analysis":""},{"time":"00:00:58,960 --> 00:01:01,960","html":"<strong>Agent:<\/strong> Ah, good morning, Mr. Rich, isn't it?","cn":"<strong>中介：<\/strong>早上好，您是Rich先生，对吗？","analysis":""},{"time":"00:01:01,960 --> 00:01:05,960","html":"<strong>Mr. Rich:<\/strong> That's right. Raymond Rich of ICT <mark style=\"background-color: #bbf7d0;\">Industries<\/mark>.","cn":"<strong>Rich先生：<\/strong>是的，我是ICT <mark style=\"background-color: #bbf7d0;\">Industries<\/mark>的Raymond Rich。","analysis":""},{"time":"00:01:05,960 --> 00:01:11,960","html":"<strong>Agent:<\/strong> ICT Industries. Just a moment while I put that on the form.","cn":"<strong>中介：<\/strong>ICT Industries。请稍等，我把它填到表格上。","analysis":"<strong>答案解析：<\/strong>第1题填 <strong>Industries<\/strong>。公司全名为ICT Industries。"},{"time":"00:01:11,960 --> 00:01:16,960","html":"<strong>Agent:<\/strong> Now, you're looking for new office space, is that right?","cn":"<strong>中介：<\/strong>您正在寻找新的办公空间，对吗？","analysis":""},{"time":"00:01:16,960 --> 00:01:20,960","html":"<strong>Mr. Rich:<\/strong> Yes, our present lease is due to expire soon.","cn":"<strong>Rich先生：<\/strong>是的，我们目前的租约很快就要到期。","analysis":""},{"time":"00:01:20,960 --> 00:01:25,960","html":"<strong>Mr. Rich:<\/strong> And as the company is expanding anyway, we need to find somewhere to move to.","cn":"<strong>Rich先生：<\/strong>而且公司正在扩张，所以无论如何都需要找地方搬迁。","analysis":""},{"time":"00:01:25,960 --> 00:01:32,960","html":"<strong>Agent:<\/strong> Do you prefer the <mark style=\"background-color: #fecaca;\">suburbs<\/mark>, the city, or a <mark style=\"background-color: #fecaca;\">commercial zone<\/mark> on the outskirts?","cn":"<strong>中介：<\/strong>您更喜欢<mark style=\"background-color: #fecaca;\">郊区<\/mark>、市中心，还是外围的<mark style=\"background-color: #fecaca;\">商业区<\/mark>？","analysis":""},{"time":"00:01:32,960 --> 00:01:36,960","html":"<strong>Mr. Rich:<\/strong> Well, currently we're in a very pleasant suburb.","cn":"<strong>Rich先生：<\/strong>我们目前所在的郊区环境非常舒适。","analysis":""},{"time":"00:01:36,960 --> 00:01:41,960","html":"<strong>Mr. Rich:<\/strong> But as I said, we've outgrown that building as we've got to move anyway.","cn":"<strong>Rich先生：<\/strong>但正如我所说，我们的规模已经超过了那栋楼的容量，反正也必须搬。","analysis":""},{"time":"00:01:41,960 --> 00:01:46,960","html":"<strong>Mr. Rich:<\/strong> I think the city centre is where we want to be, right in the heart of things.","cn":"<strong>Rich先生：<\/strong>我想我们希望去市中心，位于一切活动的核心区域。","analysis":""},{"time":"00:01:46,960 --> 00:01:49,960","html":"<strong>Agent:<\/strong> I see. Anywhere in particular?","cn":"<strong>中介：<\/strong>明白。有特别想要的位置吗？","analysis":""},{"time":"00:01:49,960 --> 00:01:56,960","html":"<strong>Mr. Rich:<\/strong> Yes, somewhere in the vicinity of the main <mark style=\"background-color: #bbf7d0;\">transport centre<\/mark>, because I have a large staff,","cn":"<strong>Rich先生：<\/strong>有，希望在主要<mark style=\"background-color: #bbf7d0;\">交通中心<\/mark>附近，因为我的员工很多，","analysis":""},{"time":"00:01:56,960 --> 00:02:00,960","html":"<strong>Mr. Rich:<\/strong> and <mark style=\"background-color: #fecaca;\">car parking<\/mark> in the city is terribly expensive.","cn":"<strong>Rich先生：<\/strong>而市中心<mark style=\"background-color: #fecaca;\">停车<\/mark>非常昂贵。","analysis":""},{"time":"00:02:00,960 --> 00:02:04,960","html":"<strong>Mr. Rich:<\/strong> I think it would be a good idea if we didn't use our cars at all.","cn":"<strong>Rich先生：<\/strong>我认为最好大家都不开车。","analysis":"<strong>答案解析：<\/strong>第2题填 <strong>transport<\/strong>。Rich先生希望位于市中心的主要交通中心附近，以便员工不必开车。"},{"time":"00:02:04,960 --> 00:02:08,960","html":"<strong>Agent:<\/strong> Exactly what size premises are you looking for?","cn":"<strong>中介：<\/strong>您需要多大面积的场所？","analysis":""},{"time":"00:02:08,960 --> 00:02:15,960","html":"<strong>Mr. Rich:<\/strong> Good question. Something more than the <mark style=\"background-color: #fecaca;\">10,000<\/mark> square metres we have at present should do it.","cn":"<strong>Rich先生：<\/strong>问得好。比我们目前的<mark style=\"background-color: #fecaca;\">一万<\/mark>平方米大一些应该就可以。","analysis":""},{"time":"00:02:15,960 --> 00:02:18,960","html":"<strong>Agent:<\/strong> Shall we say <mark style=\"background-color: #bbf7d0;\">12,000<\/mark> square metres?","cn":"<strong>中介：<\/strong>那就定为<mark style=\"background-color: #bbf7d0;\">一万二千<\/mark>平方米？","analysis":""},{"time":"00:02:18,960 --> 00:02:24,960","html":"<strong>Mr. Rich:<\/strong> That's probably about right. Yes, I think that would meet our needs.","cn":"<strong>Rich先生：<\/strong>大概正合适。是的，我想这能满足我们的需求。","analysis":"<strong>答案解析：<\/strong>第3题填 <strong>12,000<\/strong>。现有面积为10,000平方米，新办公室约需12,000平方米。"},{"time":"00:02:24,960 --> 00:02:27,960","html":"<strong>Agent:<\/strong> Just how many employees do you have to accommodate?","cn":"<strong>中介：<\/strong>您需要容纳多少名员工？","analysis":""},{"time":"00:02:27,960 --> 00:02:32,960","html":"<strong>Mr. Rich:<\/strong> <mark style=\"background-color: #bbf7d0;\">40 in all<\/mark>, but <mark style=\"background-color: #fecaca;\">only 14<\/mark> will have their own offices.","cn":"<strong>Rich先生：<\/strong><mark style=\"background-color: #bbf7d0;\">总共40人<\/mark>，但<mark style=\"background-color: #fecaca;\">只有14人<\/mark>会拥有独立办公室。","analysis":""},{"time":"00:02:32,960 --> 00:02:36,960","html":"<strong>Mr. Rich:<\/strong> The rest will be in open plan shared offices.","cn":"<strong>Rich先生：<\/strong>其余员工会在开放式共享办公室工作。","analysis":"<strong>答案解析：<\/strong>第4题填 <strong>40<\/strong>。员工总数为40人，其中只有14人拥有独立办公室。"},{"time":"00:02:36,960 --> 00:02:41,960","html":"<strong>Agent:<\/strong> Oh, I forgot to ask, do any of your employees have extra requirements?","cn":"<strong>中介：<\/strong>我忘了问，您的员工中有没有特殊需求？","analysis":""},{"time":"00:02:41,960 --> 00:02:44,960","html":"<strong>Agent:<\/strong> Will we need to consider people with <mark style=\"background-color: #fecaca;\">disabilities<\/mark>?","cn":"<strong>中介：<\/strong>我们是否需要考虑<mark style=\"background-color: #fecaca;\">残障人士<\/mark>？","analysis":""},{"time":"00:02:44,960 --> 00:02:50,960","html":"<strong>Mr. Rich:<\/strong> Yes. Actually, there is one in a <mark style=\"background-color: #bbf7d0;\">wheelchair<\/mark> who'll need suitable access,","cn":"<strong>Rich先生：<\/strong>有。实际上有一位使用<mark style=\"background-color: #bbf7d0;\">轮椅<\/mark>，需要合适的通道，","analysis":""},{"time":"00:02:50,960 --> 00:02:53,960","html":"<strong>Mr. Rich:<\/strong> and another who can walk just a few paces.","cn":"<strong>Rich先生：<\/strong>还有一位只能走几步路。","analysis":""},{"time":"00:02:53,960 --> 00:02:58,960","html":"<strong>Mr. Rich:<\/strong> She uses a <mark style=\"background-color: #fecaca;\">mobility scooter<\/mark>, so we'd need to make sure all facilities,","cn":"<strong>Rich先生：<\/strong>她使用<mark style=\"background-color: #fecaca;\">代步车<\/mark>，所以我们需要确保所有设施，","analysis":""},{"time":"00:02:58,960 --> 00:03:03,960","html":"<strong>Mr. Rich:<\/strong> especially toilet facilities, were suitable and accessible,","cn":"<strong>Rich先生：<\/strong>特别是卫生间设施，都是合适且无障碍的。","analysis":""},{"time":"00:03:03,960 --> 00:03:07,960","html":"<strong>Mr. Rich:<\/strong> and we'd also need to be either on the ground floor,","cn":"<strong>Rich先生：<\/strong>而且办公室要么位于一楼，","analysis":""},{"time":"00:03:07,960 --> 00:03:12,960","html":"<strong>Mr. Rich:<\/strong> or to find a secure place by the lifts, for Mrs Jackson to park her scooter.","cn":"<strong>Rich先生：<\/strong>要么在电梯旁为Jackson女士找一个安全地点停放代步车。","analysis":"<strong>答案解析：<\/strong>第5题填 <strong>wheelchair<\/strong>。一名员工使用轮椅，需要无障碍通道；代步车停车位已在题干中给出。"},{"time":"00:03:12,960 --> 00:03:17,960","html":"<strong>Agent:<\/strong> I'll need to keep that in mind when I come up with the property for you to look at.","cn":"<strong>中介：<\/strong>我为您筛选可查看的房产时会记住这一点。","analysis":""},{"time":"00:03:17,960 --> 00:03:20,960","html":"<strong>Agent:<\/strong> Now, when are you thinking of moving?","cn":"<strong>中介：<\/strong>那么，您打算什么时候搬？","analysis":""},{"time":"00:03:20,960 --> 00:03:28,960","html":"<strong>Mr. Rich:<\/strong> Well, our current lease expires in <mark style=\"background-color: #fecaca;\">August<\/mark>, so we'd like to have the move completed by then, of course.","cn":"<strong>Rich先生：<\/strong>我们目前的租约<mark style=\"background-color: #fecaca;\">八月<\/mark>到期，所以当然希望届时已经完成搬迁。","analysis":""},{"time":"00:03:28,960 --> 00:03:34,960","html":"<strong>Agent:<\/strong> Well, there is a very suitable property that I have in mind, here in the city,","cn":"<strong>中介：<\/strong>我想到市中心有一处非常合适的房产，","analysis":""},{"time":"00:03:34,960 --> 00:03:39,960","html":"<strong>Agent:<\/strong> but the owners want a lease signed by the end of this month, <mark style=\"background-color: #fecaca;\">may<\/mark>.","cn":"<strong>中介：<\/strong>但业主希望在本月底，也就是<mark style=\"background-color: #fecaca;\">五月<\/mark>底之前签好租约。","analysis":""},{"time":"00:03:39,960 --> 00:03:45,960","html":"<strong>Mr. Rich:<\/strong> Oh, too early, I'm afraid. I'd be ready to sign up by the end of <mark style=\"background-color: #fecaca;\">June<\/mark>, though.","cn":"<strong>Rich先生：<\/strong>恐怕太早了。不过我可以在<mark style=\"background-color: #fecaca;\">六月<\/mark>底前签约。","analysis":""},{"time":"00:03:45,960 --> 00:03:52,960","html":"<strong>Agent:<\/strong> Shall we say, signed up by the first of <mark style=\"background-color: #bbf7d0;\">July<\/mark>, and moved by the end of that month?","cn":"<strong>中介：<\/strong>那就定为<mark style=\"background-color: #bbf7d0;\">七月<\/mark>一日前签约，并在七月底前搬完？","analysis":""},{"time":"00:03:52,960 --> 00:03:54,960","html":"<strong>Mr. Rich:<\/strong> Definitely.","cn":"<strong>Rich先生：<\/strong>完全可以。","analysis":"<strong>答案解析：<\/strong>第6题填 <strong>July<\/strong>。五月太早，六月底签约，最终计划七月一日前签约并在七月底前搬完。"},{"time":"00:03:54,960 --> 00:04:02,960","html":"<strong>Narrator:<\/strong> Before you hear the rest of the conversation, you have some time to look at questions seven to ten.","cn":"<strong>旁白：<\/strong>在继续听对话其余部分之前，你有一些时间浏览第7至第10题。","analysis":""},{"time":"00:04:09,960 --> 00:04:24,960","html":"<strong>Narrator:<\/strong> Now listen, and answer questions seven to ten.","cn":"<strong>旁白：<\/strong>现在请听录音，并回答第7至第10题。","analysis":""},{"time":"00:04:24,960 --> 00:04:31,960","html":"<strong>Agent:<\/strong> Well, I'll keep your requirements in mind, and let you know when something comes up.","cn":"<strong>中介：<\/strong>好的，我会记住您的要求，有合适房源时通知您。","analysis":""},{"time":"00:04:31,960 --> 00:04:37,960","html":"<strong>Agent:<\/strong> Wait a minute, there is a vacant office space on the tenth floor of this very building.","cn":"<strong>中介：<\/strong>等一下，这栋楼的十楼正好有一处空置办公空间。","analysis":""},{"time":"00:04:38,960 --> 00:04:40,960","html":"<strong>Agent:<\/strong> Would you care to take a look?","cn":"<strong>中介：<\/strong>您愿意去看看吗？","analysis":""},{"time":"00:04:40,960 --> 00:04:47,960","html":"<strong>Agent:<\/strong> It has already just become available, but I haven't started marketing it yet because it's in need of a bit of a makeover.","cn":"<strong>中介：<\/strong>它刚刚空出来，我还没开始推广，因为需要稍微翻新一下。","analysis":""},{"time":"00:04:47,960 --> 00:04:51,960","html":"<strong>Agent:<\/strong> The floor area is about the right size.","cn":"<strong>中介：<\/strong>楼层面积大致符合要求。","analysis":""},{"time":"00:04:51,960 --> 00:04:54,960","html":"<strong>Mr. Rich:<\/strong> Good. Let's see it then.","cn":"<strong>Rich先生：<\/strong>好，那我们去看看。","analysis":""},{"time":"00:04:54,960 --> 00:05:04,960","html":"<strong>Agent:<\/strong> Well, what do you think? Elevator access is great, and the lobby area is roomy enough for that disability vehicle you were telling me about.","cn":"<strong>中介：<\/strong>您觉得怎么样？电梯通行很好，大堂也足够宽敞，可以容纳您提到的残障代步车。","analysis":""},{"time":"00:05:04,960 --> 00:05:09,960","html":"<strong>Mr. Rich:<\/strong> Oh, I don't know. There are too many <mark style=\"background-color: #fecaca;\">small offices<\/mark>.","cn":"<strong>Rich先生：<\/strong>我不太确定。这里的<mark style=\"background-color: #fecaca;\">小办公室<\/mark>太多了。","analysis":""},{"time":"00:05:09,960 --> 00:05:14,960","html":"<strong>Mr. Rich:<\/strong> Would we be able to take out a few of these <mark style=\"background-color: #bbf7d0;\">walls<\/mark> and make bigger work areas?","cn":"<strong>Rich先生：<\/strong>我们能否拆掉其中几面<mark style=\"background-color: #bbf7d0;\">墙<\/mark>，做成更大的工作区？","analysis":""},{"time":"00:05:14,960 --> 00:05:18,960","html":"<strong>Agent:<\/strong> I don't see why not. Most of them are just <mark style=\"background-color: #fecaca;\">partitions<\/mark>.","cn":"<strong>中介：<\/strong>我看没有问题，大多数只是<mark style=\"background-color: #fecaca;\">隔断<\/mark>。","analysis":""},{"time":"00:05:18,960 --> 00:05:25,960","html":"<strong>Agent:<\/strong> Obviously load-bearing walls can't be touched, but there aren't many of those to worry about.","cn":"<strong>中介：<\/strong>承重墙当然不能动，不过这里没有多少承重墙需要担心。","analysis":"<strong>答案解析：<\/strong>第7题填 <strong>walls<\/strong>。Rich先生希望拆掉几面墙，把小办公室合并成更大的工作区。"},{"time":"00:05:25,960 --> 00:05:28,960","html":"<strong>Mr. Rich:<\/strong> What about kitchen and dining facilities?","cn":"<strong>Rich先生：<\/strong>厨房和用餐设施怎么样？","analysis":""},{"time":"00:05:28,960 --> 00:05:32,960","html":"<strong>Mr. Rich:<\/strong> We like our staff to feel comfortable eating at work.","cn":"<strong>Rich先生：<\/strong>我们希望员工在办公室用餐时感到舒适。","analysis":""},{"time":"00:05:32,960 --> 00:05:38,960","html":"<strong>Mr. Rich:<\/strong> If they go out for lunch, it often means extended lunch hours and lost time.","cn":"<strong>Rich先生：<\/strong>如果他们出去吃午饭，往往意味着午休时间延长并浪费时间。","analysis":""},{"time":"00:05:38,960 --> 00:05:41,960","html":"<strong>Agent:<\/strong> Come this way. This is the <mark style=\"background-color: #bbf7d0;\">kitchen<\/mark>.","cn":"<strong>中介：<\/strong>这边请，这里是<mark style=\"background-color: #bbf7d0;\">厨房<\/mark>。","analysis":""},{"time":"00:05:41,960 --> 00:05:48,960","html":"<strong>Mr. Rich:<\/strong> Ooh, it's a bit <mark style=\"background-color: #bbf7d0;\">pokey<\/mark>. We'd need to enlarge it somehow. What's behind the wall here?","cn":"<strong>Rich先生：<\/strong>哦，有点<mark style=\"background-color: #bbf7d0;\">狭小<\/mark>。我们得设法扩大它。这面墙后面是什么？","analysis":""},{"time":"00:05:48,960 --> 00:05:55,960","html":"<strong>Agent:<\/strong> There's just a <mark style=\"background-color: #fecaca;\">storeroom<\/mark>. You could take out that wall and expand into that space.","cn":"<strong>中介：<\/strong>只是一个<mark style=\"background-color: #fecaca;\">储藏室<\/mark>。可以拆掉那面墙，扩展到那块空间。","analysis":""},{"time":"00:05:55,960 --> 00:05:58,960","html":"<strong>Mr. Rich:<\/strong> Then what would we do for a storeroom?","cn":"<strong>Rich先生：<\/strong>那储藏室怎么办？","analysis":""},{"time":"00:05:58,960 --> 00:06:02,960","html":"<strong>Agent:<\/strong> Ah, well. See that tiny office near the entrance?","cn":"<strong>中介：<\/strong>嗯，看到入口附近那个很小的办公室了吗？","analysis":""},{"time":"00:06:02,960 --> 00:06:07,960","html":"<strong>Agent:<\/strong> It has no external windows or natural light. It would make an ideal storeroom.","cn":"<strong>中介：<\/strong>它没有外窗或自然光，非常适合改成储藏室。","analysis":"<strong>答案解析：<\/strong>第8题填 <strong>kitchen<\/strong>。厨房太小，可拆除与储藏室之间的墙进行扩建。"},{"time":"00:06:07,960 --> 00:06:12,960","html":"<strong>Mr. Rich:<\/strong> Yes, you're right. The whole place is a bit dilapidated.","cn":"<strong>Rich先生：<\/strong>你说得对。整个地方有些破旧。","analysis":""},{"time":"00:06:12,960 --> 00:06:16,960","html":"<strong>Mr. Rich:<\/strong> Obviously in need of that redecoration you were talking about.","cn":"<strong>Rich先生：<\/strong>显然需要你刚才提到的重新装修。","analysis":""},{"time":"00:06:16,960 --> 00:06:22,960","html":"<strong>Mr. Rich:<\/strong> And I don't just mean a coat of new <mark style=\"background-color: #fecaca;\">paint<\/mark>. I think all the <mark style=\"background-color: #fecaca;\">light fittings<\/mark> would have to be modernized.","cn":"<strong>Rich先生：<\/strong>而且不只是刷一层<mark style=\"background-color: #fecaca;\">新漆<\/mark>，我认为所有<mark style=\"background-color: #fecaca;\">灯具<\/mark>都必须更新。","analysis":""},{"time":"00:06:22,960 --> 00:06:29,960","html":"<strong>Mr. Rich:<\/strong> Those broken <mark style=\"background-color: #fecaca;\">blinds<\/mark> have to be replaced. And this old blue <mark style=\"background-color: #bbf7d0;\">carpet<\/mark> definitely has to go.","cn":"<strong>Rich先生：<\/strong>那些坏掉的<mark style=\"background-color: #fecaca;\">百叶窗<\/mark>必须更换，这块旧蓝色<mark style=\"background-color: #bbf7d0;\">地毯<\/mark>也肯定要换掉。","analysis":"<strong>答案解析：<\/strong>第9题填 <strong>carpet<\/strong>。除油漆、灯具和百叶窗外，旧蓝色地毯也必须更换。"},{"time":"00:06:29,960 --> 00:06:37,960","html":"<strong>Agent:<\/strong> I agree. That's something we can negotiate with the owner. But overall, do you think it would fit your requirements?","cn":"<strong>中介：<\/strong>我同意。这可以与业主协商。不过总体而言，您认为这里符合要求吗？","analysis":""},{"time":"00:06:37,960 --> 00:06:42,960","html":"<strong>Mr. Rich:<\/strong> Well, you haven't given me any indication of what the lease would cost.","cn":"<strong>Rich先生：<\/strong>你还没有告诉我租金大概是多少。","analysis":""},{"time":"00:06:42,960 --> 00:06:48,960","html":"<strong>Mr. Rich:<\/strong> But before we get into that, what are the terms of the lease concerning length of tenancy?","cn":"<strong>Rich先生：<\/strong>不过在谈租金之前，租约对租期长度有什么规定？","analysis":""},{"time":"00:06:48,960 --> 00:06:53,960","html":"<strong>Agent:<\/strong> Well, generally in the city, leases are never less than <mark style=\"background-color: #bbf7d0;\">three years<\/mark>.","cn":"<strong>中介：<\/strong>通常市中心的租约不会少于<mark style=\"background-color: #bbf7d0;\">三年<\/mark>。","analysis":""},{"time":"00:06:53,960 --> 00:07:02,960","html":"<strong>Mr. Rich:<\/strong> Oh, I mean we don't mind signing up for that period of time initially, but we don't necessarily want to have to move after that.","cn":"<strong>Rich先生：<\/strong>哦，我们最初并不介意签这么长时间，但不一定希望到期后必须搬走。","analysis":""},{"time":"00:07:02,960 --> 00:07:06,960","html":"<strong>Mr. Rich:<\/strong> We've been in our last place for ten years, you know.","cn":"<strong>Rich先生：<\/strong>你知道，我们在上一个地方已经待了十年。","analysis":""},{"time":"00:07:06,960 --> 00:07:16,960","html":"<strong>Agent:<\/strong> Well, the usual agreement is a <mark style=\"background-color: #fecaca;\">three by three by two<\/mark>. That's a contract for three years with entitlement to extension for three years.","cn":"<strong>中介：<\/strong>通常协议是“<mark style=\"background-color: #fecaca;\">三加三加二<\/mark>”，即先签三年，并有权再延长三年。","analysis":""},{"time":"00:07:16,960 --> 00:07:22,960","html":"<strong>Agent:<\/strong> And then another two years after that. But let me speak to the owner first.","cn":"<strong>中介：<\/strong>之后还可以再延长两年。不过我得先和业主谈谈。","analysis":"<strong>答案解析：<\/strong>第10题填 <strong>3 years<\/strong>。市中心租约的最低期限通常为三年，之后才讨论续租安排。"},{"time":"00:07:22,960 --> 00:07:28,960","html":"<strong>Mr. Rich:<\/strong> Hmm. And one more thing. We have to consider the time frame.","cn":"<strong>Rich先生：<\/strong>嗯，还有一点，我们必须考虑时间安排。","analysis":""},{"time":"00:07:28,960 --> 00:07:32,960","html":"<strong>Mr. Rich:<\/strong> Remember, my current lease is due to expire in August.","cn":"<strong>Rich先生：<\/strong>记住，我目前的租约八月就到期。","analysis":""},{"time":"00:07:32,960 --> 00:07:39,960","html":"<strong>Agent:<\/strong> Well, with reliable contractors, it shouldn't take more than a couple of months to do the necessary refit.","cn":"<strong>中介：<\/strong>如果承包商可靠，完成必要的改装应该不会超过两个月。","analysis":""},{"time":"00:07:39,960 --> 00:07:48,960","html":"<strong>Narrator:<\/strong> That is the end of part one.","cn":"<strong>旁白：<\/strong>第一部分到此结束。","analysis":""},{"time":"00:07:48,960 --> 00:07:53,960","html":"<strong>Narrator:<\/strong> You now have one minute to check your answers to part one.","cn":"<strong>旁白：<\/strong>现在你有一分钟时间检查第一部分的答案。","analysis":""}],"transcriptHighlights":[{"qid":"1","text":"Industries","answer":"Industries"},{"qid":"2","text":"Transport center","answer":"Transport center/transport centre"},{"qid":"2","text":"transport centre","answer":"Transport center/transport centre"},{"qid":"3","text":"12000","answer":"12000/12,000"},{"qid":"3","text":"12,000","answer":"12000/12,000"},{"qid":"4","text":"40","answer":"40/forty"},{"qid":"4","text":"forty","answer":"40/forty"},{"qid":"5","text":"Wheelchair","answer":"Wheelchair"},{"qid":"6","text":"July","answer":"July"},{"qid":"7","text":"Walls","answer":"Walls"},{"qid":"8","text":"Kitchen","answer":"Kitchen"},{"qid":"9","text":"Carpet","answer":"Carpet"},{"qid":"10","text":"3 years","answer":"3 years"}],"ownerInfo":"此内容由🍠@Listening 永不虾滑整理，仅作为分享供个人使用；禁止商用、倒卖和引流。有问题请先仔细看🍠这个账号的置顶和分享贴。没有团队，不是机构，纯个人分享。督学和其他相关课程请咨询主页另一个号@心情有点虾滑（不回任何机经相关消息）。"}</script>
<script>
const DATA=JSON.parse(document.getElementById('test-data').textContent);const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];const RENDER_VERSION=17;
let secs=0,review=false,timer=setInterval(()=>{secs++;drawTimer();if(secs%5===0)save(false)},1000),drag=null,currentCue=-1,loopCue=false,slowCue=false,showCn=true,showAnalysis=true,dictationMode=false,showOriginal=true,dictationAnswers={};const storeKey='ielts_v4_'+DATA.title.replace(/\W+/g,'_');
const CONFIG_DATA={answerKey:DATA.answerKey,questionList:DATA.questionIds.map(q=>Number(q)||q),localStorageKey:storeKey};window.localStorageKey=storeKey;window.DATA=DATA;window.CONFIG_DATA=CONFIG_DATA;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function matchingRepeatAttr(g){return (g.questions||[]).length>(g.options||[]).length?' data-repeat="true"':''}
function flowQuestionMap(g){let map={};(g.questions||[]).forEach(q=>map[q[0]]=q[1]);return map}
function flowQidsInText(raw,qmap){return Object.keys(qmap).filter(id=>new RegExp(`(?<!\\d)${id}(?!\\d)`).test(raw)).sort((a,b)=>Number(a)-Number(b))}
function renderFlowText(raw,qids){qids=Array.isArray(qids)?qids:[qids];let html=esc(String(raw||''));qids.forEach(qid=>{html=html.replace(new RegExp(`(?<!\\d)${qid}(?!\\d)`),`<span class="flow-num">${qid}</span>`)});let slotIdx=0;html=html.replace(/(?:_{2,}|…{2,}|\.{4,})/g,()=>{let qid=qids[slotIdx++]||qids[qids.length-1];return `<span class="slot" data-q="${qid}"></span>`});qids.slice(slotIdx).forEach(qid=>{html+=` <span class="slot" data-q="${qid}"></span>`});return html}
function renderFlowLine(line,qmap,used){let raw=String((typeof line==='object'&&line?line.text:line)||''),qids=flowQidsInText(raw,qmap);if(qids.length){qids.forEach(qid=>used.add(qid));return `<div class="flow-step flow-step-full"><div class="flow-text">${renderFlowText(raw,qids)}</div></div>`}return `<div class="flow-note">${esc(raw)}</div>`}
function renderFlowTable(lines,qmap,used){let rows=[],maxCols=1;lines.forEach(line=>{let meta=typeof line==='object'&&line?line:{},row=Number(meta.row)||0,col=Number(meta.col)||0,cols=Number(meta.cols)||1,raw=String(meta.text||''),qids=flowQidsInText(raw,qmap);maxCols=Math.max(maxCols,cols,col+1);if(!rows[row])rows[row]=[];if(!rows[row][col])rows[row][col]=[];qids.forEach(qid=>used.add(qid));rows[row][col].push(`<div class="flow-text">${qids.length?renderFlowText(raw,qids):esc(raw)}</div>`)});return `<div class="flow-table-wrap"><table class="flow-table">${rows.map(cells=>{let filled=(cells||[]).map((parts,col)=>parts?{col,html:parts.join('')}:null).filter(Boolean);return `<tr>${filled.map(cell=>{let span=filled.length===1&&maxCols>1?` colspan="${maxCols}"`:'';return `<td${span}>${cell.html}</td>`}).join('')}</tr>`}).join('')}</table></div>`}
function renderFlowSteps(g){let qmap=flowQuestionMap(g),used=new Set(),lines=(g.bodyLines&&g.bodyLines.length?g.bodyLines:[]);if(lines.length){let html='',i=0;while(i<lines.length){let meta=typeof lines[i]==='object'&&lines[i]?lines[i]:{};if(meta.table){let table=meta.table,chunk=[];while(i<lines.length){let m=typeof lines[i]==='object'&&lines[i]?lines[i]:{};if(m.table!==table)break;chunk.push(lines[i++])}html+=renderFlowTable(chunk,qmap,used);continue}html+=renderFlowLine(lines[i++],qmap,used)}return html+(g.questions||[]).filter(q=>!used.has(q[0])).map(q=>`<div class="flow-step"><div class="flow-num">${q[0]}</div><div class="flow-text">${esc(q[1])}</div><span class="slot" data-q="${q[0]}"></span></div>`).join('')}return g.questions.map((q,idx)=>`<div class="flow-step"><div class="flow-num">${q[0]}</div><div class="flow-text">${esc(q[1])}</div><span class="slot" data-q="${q[0]}"></span></div>${idx<g.questions.length-1?'<div class="flow-arrow">↓</div>':''}`).join('')}
function groupHTML(g){if(g.type==='matching'&&g.layout==='flow')return `<section class="group"${matchingRepeatAttr(g)}><h3>${esc(g.title)}</h3><div class="instruction">${esc(g.instruction)}</div><div class="flow-layout"><div class="flow-steps">${renderFlowSteps(g)}</div><div><strong>${esc(g.optionsTitle||'Options')}</strong><div class="pool">${g.options.map(o=>`<div class="drag" draggable="true" data-value="${o[0]}">${o[0]} ${esc(o[1])}</div>`).join('')}</div></div></div></section>`;
if(g.type==='matching'&&g.layout==='diagram')return `<section class="group"${matchingRepeatAttr(g)}><h3>${esc(g.title)}</h3><div class="instruction">${esc(g.instruction)}</div><div class="map-layout"><div class="map-image"><img src="${esc(g.image||'diagram.png')}" alt="Diagram"></div><div class="matching"><div>${g.questions.map(q=>`<div class="match-row"><strong>${q[0]}</strong><span>${esc(q[1])}</span><span class="slot" data-q="${q[0]}"></span></div>`).join('')}</div><div><strong>${esc(g.optionsTitle||'Options')}</strong><div class="pool">${g.options.map(o=>`<div class="drag" draggable="true" data-value="${o[0]}">${o[0]} ${esc(o[1])}</div>`).join('')}</div></div></div></div></section>`;
if(g.type==='matching')return `<section class="group"${matchingRepeatAttr(g)}><h3>${esc(g.title)}</h3><div class="instruction">${esc(g.instruction)}</div><div class="matching"><div>${g.questions.map(q=>`<div class="match-row"><strong>${q[0]}</strong><span>${esc(q[1])}</span><span class="slot" data-q="${q[0]}"></span></div>`).join('')}</div><div><strong>${esc(g.optionsTitle||'Options')}</strong><div class="pool">${g.options.map(o=>`<div class="drag" draggable="true" data-value="${o[0]}">${o[0]} ${esc(o[1])}</div>`).join('')}</div></div></div></section>`;
if(g.type==='map')return `<section class="group"><h3>${esc(g.title)}</h3><div class="instruction">${esc(g.instruction)}</div><div class="map-layout"><div class="map-image"><img src="${esc(g.image||'map.png')}" alt="Map" onerror="if(this.dataset.fallback!=='1'){this.dataset.fallback='1';this.src='diagram.png'}"></div><div class="map-grid"><div class="map-answer-list">${g.questions.map(q=>`<div class="map-row"><div class="map-row-label"><strong>${q[0]}</strong> ${esc(q[1]||'')}</div><div class="map-options" style="--map-options:${(g.options||[]).length||1}">${(g.options||[]).map(o=>`<div class="choice map-choice" data-name="q${q[0]}" data-value="${o}">${o}</div>`).join('')}</div></div>`).join('')}</div></div></div></section>`;
if(g.type==='single')return `<section class="group"><h3>${esc(g.title)}</h3><div class="instruction">${esc(g.instruction)}</div>${g.questions.map(q=>`<p><strong>${q.id}</strong> ${esc(q.text)}</p>${q.options.map(o=>`<div class="choice single-choice" data-name="q${q.id}" data-value="${o[0]}">${o[0]} ${esc(o[1])}</div>`).join('')}`).join('')}</section>`;
if(g.type==='multiple')return `<section class="group" data-limit="${g.limit}" data-id="${g.id}"><h3>${esc(g.title)}</h3><div class="instruction">${esc(g.instruction)}</div><p><strong>${esc(g.id)}</strong> ${esc(g.questionText)}</p>${g.options.map(o=>`<div class="choice multi-choice" data-name="q${g.id.replace('-','_')}" data-value="${o[0]}">${o[0]} ${esc(o[1])}</div>`).join('')}</section>`;
return `<section class="group"><h3>${esc(g.title)}</h3>${renderFillGroup(g)}</section>`}
function renderFillGroup(g){let qids=(g.questions||[]).map(q=>String(q.id));let used=new Set();let lines=(g.bodyLines&&g.bodyLines.length?g.bodyLines:g.questions.map(q=>`${q.id} ${q.text} _____`));let html='',i=0;while(i<lines.length){let meta=typeof lines[i]==='object'&&lines[i]?lines[i]:{};if(meta.table){let table=meta.table,chunk=[];while(i<lines.length){let m=typeof lines[i]==='object'&&lines[i]?lines[i]:{};if(m.table!==table)break;chunk.push(lines[i++])}html+=renderFillTable(chunk,qids,used);continue}html+=renderFillLine(lines[i++],qids,used)}return html||`<div class="instruction">${esc(g.instruction||'Complete the notes below.')}</div>`}
function renderFillTable(lines,qids,used){let rows=[],maxCols=1;lines.forEach(line=>{let meta=typeof line==='object'&&line?line:{},row=Number(meta.row)||0,col=Number(meta.col)||0,cols=Number(meta.cols)||1;maxCols=Math.max(maxCols,cols,col+1);if(!rows[row])rows[row]=[];if(!rows[row][col])rows[row][col]=[];rows[row][col].push(`<div class="fill-table-line">${renderFillLine(line,qids,used,true)}</div>`)});return `<div class="fill-table-wrap"><table class="fill-table">${rows.map((cells,idx)=>{let filled=(cells||[]).map((parts,col)=>parts?{col,html:parts.join('')}:null).filter(Boolean);return `<tr>${filled.map(cell=>{let tag=idx===0?'th':'td',span=filled.length===1&&maxCols>1?` colspan="${maxCols}"`:'';return `<${tag}${span}>${cell.html}</${tag}>`}).join('')}</tr>`}).join('')}</table></div>`}
function fillInput(qid,lead=''){return `<span class="blank-q">${esc(qid)}</span>${esc(lead)}<input class="blank" name="q${esc(qid)}" type="text" autocomplete="off" inputmode="text">`}
function fillLineAttrs(meta,isHeading){let cls=['doc-line'];if(isHeading)cls.push('fill-heading');if(meta.list)cls.push('is-list');let rawLevel=Math.max(0,Math.min(6,Number(meta.level)||0)),level=rawLevel>0?rawLevel+1:rawLevel;let style=meta.list?` style="--indent:${level*30}px"`:'';return `class="${cls.join(' ')}"${style}`}
function fillLineContent(meta,body){let level=Math.max(0,Number(meta.level)||0),bullet=level>0?'◦':'•';return meta.list?`<span class="doc-bullet">${bullet}</span><span class="doc-line-content">${body}</span>`:body}
function isFillHeading(raw,meta,hit){return !hit&&!meta.list&&!/(?:_{2,}|…{2,}|\.{4,})/.test(raw)&&!/^\d+\.?\s+/.test(raw)&&!/^(?:Complete|Write|Choose)\b/i.test(raw)}
function renderFillLine(line,qids,used,inner=false){let meta=typeof line==='object'&&line?line:{},raw=String(meta.text??line),html=esc(raw),hit=false;html=html.replace(/(^|[^\d])(\d{1,2})\.?\s*((?:£\s*)?)(?:_{2,}|…{2,}|\.{4,})/g,(m,prefix,qid,lead)=>{if(!qids.includes(qid))return m;used.add(qid);hit=true;return prefix+fillInput(qid,lead)});let m=raw.match(/^(\d+)\.?\s+(.+)$/);if(!hit&&m&&qids.includes(m[1])){used.add(m[1]);let body=esc(m[2]);let input=fillInput(m[1]);body=/(?:_+|…{2,}|\.{4,})/.test(body)?body.replace(/(?:_+|…{2,}|\.{4,})/,input):`${body} ${input}`;return inner?fillLineContent(meta,body):`<p ${fillLineAttrs(meta,false)}>${fillLineContent(meta,body)}</p>`}return inner?html:`<p ${fillLineAttrs(meta,isFillHeading(raw,meta,hit))}>${fillLineContent(meta,html)}</p>`}
function hardResetAnswers(){$$('input').forEach(i=>{i.value='';i.defaultValue=''});$$('.choice').forEach(c=>c.classList.remove('selected'));$$('.slot').forEach(s=>s.innerHTML='');refreshPool();updateNav()}
function render(){document.title=DATA.title;$('#ownerMeta').textContent=DATA.ownerInfo||'';$('#audio').src=DATA.audio||'audio.mp3';$('#content').innerHTML=DATA.groups.map(groupHTML).join('');$('#nav').innerHTML=DATA.questionIds.map(q=>`<div data-q="${q}">${q}</div>`).join('');bindDynamic();hardResetAnswers();load();updateNav()}

function questionInText(q,text){let n=Number(String(q).replace(/\D/g,""));if(!n||!text)return false;let raw=String(text).replace(/&nbsp;/g," ");let direct=new RegExp("(?:问题|Question|Q)\\s*0?"+n+"(?!\\d)|第\\s*0?"+n+"\\s*题|(?<!\\d)0?"+n+"\\s*题","i").test(raw)||new RegExp("(?:data-question=[\"']?|class=[\"'][^\"']*q)0?"+n+"(?!\\d)","i").test(raw);if(direct)return true;let re=/(?:问题|Question|Q|第)?\s*(\d+)\s*(?:-|–|—|至|到|和|and|to|&)\s*(\d+)\s*题?/gi,m;while((m=re.exec(raw))){let a=Number(m[1]),b=Number(m[2]);if(n>=Math.min(a,b)&&n<=Math.max(a,b))return true}return false}

function highlightTerms(){let terms=[];for(let item of DATA.transcriptHighlights||[]){let text=typeof item==='string'?item:item.text;if(text){terms.push(String(text));String(text).split(/\s+/).map(w=>w.replace(/[^A-Za-z0-9'-]/g,'')).filter(w=>w.length>=5&&!/^(which|three|answer|letter|about|their|there|would|could|should)$/i.test(w)).forEach(w=>terms.push(w))}}return [...new Set(terms.map(t=>t.trim()).filter(t=>t.length>1))].sort((a,b)=>b.length-a.length)}

function showToast(msg='Progress saved!'){$('#toast').textContent=msg;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),1400)}
function collectAnswers(){let answers={text:{},single:{},multiple:{},matching:{},map:{}};$$('#content input[name^="q"]').forEach(i=>answers.text[i.name]=i.value);$$('.single-choice.selected').forEach(c=>answers.single[c.dataset.name]=c.dataset.value);$$('.map-choice.selected').forEach(c=>answers.map[c.dataset.name]=c.dataset.value);let names=[...new Set($$('.multi-choice').map(c=>c.dataset.name))];names.forEach(name=>answers.multiple[name]=$$(`.multi-choice[data-name="${name}"].selected`).map(c=>c.dataset.value));$$('.slot').forEach(s=>{let tag=s.querySelector('.tag');if(tag)answers.matching[s.dataset.q]=tag.dataset.value});return answers}
function restoreAnswers(a={}){hardResetAnswers();Object.entries(a.text||{}).forEach(([name,val])=>{let el=$(`input[name="${name}"]`);if(el)el.value=val});Object.entries(a.single||{}).forEach(([name,val])=>{let el=$(`.single-choice[data-name="${name}"][data-value="${val}"]`);if(el)el.classList.add('selected')});Object.entries(a.map||{}).forEach(([name,val])=>{let el=$(`.map-choice[data-name="${name}"][data-value="${val}"]`);if(el)el.classList.add('selected')});Object.entries(a.multiple||{}).forEach(([name,vals])=>(vals||[]).forEach(val=>{let el=$(`.multi-choice[data-name="${name}"][data-value="${val}"]`);if(el)el.classList.add('selected')}));Object.entries(a.matching||{}).forEach(([qid,val])=>{let opt=$(`.drag[data-value="${val}"]`),slot=$(`.slot[data-q="${qid}"]`);if(opt&&slot)slot.innerHTML=`<span class="tag" draggable="true" data-value="${val}">${esc(opt.textContent)}</span>`});refreshPool();restoreDragging();updateNav()}
function contentSnapshot(){let clone=$('#content').cloneNode(true);clone.querySelectorAll('.review').forEach(r=>r.remove());clone.querySelectorAll('input').forEach(i=>{i.setAttribute('value',i.value);i.removeAttribute('disabled')});clone.querySelectorAll('.choice').forEach(c=>c.classList.remove('disabled'));return clone.innerHTML}
function notesSnapshot(){$$('#notesList textarea').forEach(t=>{t.textContent=t.value;t.setAttribute('data-value',t.value)});return $('#notesList').innerHTML}
function layoutSignature(){return JSON.stringify([RENDER_VERSION,(DATA.groups||[]).map(g=>[g.type,g.layout||'',g.id||'',g.title||'',g.instruction||'',g.questionText||'',g.image||'',(g.options||[]),(g.questions||[]).map(q=>JSON.stringify(q))])])}
function save(show=false){let data={secs,answers:collectAnswers(),contentHtml:contentSnapshot(),layoutSignature:layoutSignature(),notes:notesSnapshot(),dark:document.body.classList.contains('dark'),font:document.documentElement.style.fontSize,dictationAnswers,studyState:{currentCue,loopCue,slowCue,showCn,showAnalysis,dictationMode,showOriginal},audioTime:audio?.currentTime||0};localStorage.setItem(storeKey,JSON.stringify(data));if(show)showToast()}
function load(){let raw=localStorage.getItem(storeKey);if(!raw)return;let d;try{d=JSON.parse(raw)}catch(err){console.warn('Saved progress could not be read.',err);return}secs=d.secs||0;if(d.answers){try{restoreAnswers(d.answers)}catch(err){console.warn('Saved answers could not be restored.',err)}}if(d.dictationAnswers)dictationAnswers=d.dictationAnswers;if(d.studyState)try{({currentCue=currentCue,loopCue=loopCue,slowCue=slowCue,showCn=showCn,showAnalysis=showAnalysis,dictationMode=dictationMode,showOriginal}=d.studyState)}catch(err){console.warn('Study state could not be restored.',err)}if(d.notes){try{$('#notesList').innerHTML=d.notes;$$('#notesList textarea').forEach(t=>{t.value=t.dataset.value||t.textContent||''})}catch(err){console.warn('Saved notes could not be restored.',err)}}if(d.dark)document.body.classList.add('dark');setFontSize(d.font||DEFAULT_FONT_SIZE,false);if(d.audioTime)audio.addEventListener('loadedmetadata',()=>{audio.currentTime=d.audioTime},{once:true});bindNoteDeletes();drawTimer()}
function handleSelection(e){if(e.target.closest('#selbar,#notes,.bottom-bar'))return;let sel=window.getSelection();let hl=e.target.closest?.('.hl-brown,.hl-rose,.hl-blue');let bar=$('#selbar');if(hl&&sel.isCollapsed){bar.targetElem=hl;placeBar(bar,hl.getBoundingClientRect())}else if(sel&&!sel.isCollapsed&&$('#content').contains(sel.anchorNode)){bar.targetElem=null;placeBar(bar,sel.getRangeAt(0).getBoundingClientRect())}else{bar.hidden=true}}
function placeBar(bar,rect){bar.hidden=false;bar.style.left=Math.max(8,window.scrollX+rect.left+rect.width/2-95)+'px';bar.style.top=Math.max(8,window.scrollY+rect.top-46)+'px'}
function highlightedFromSelection(){let sel=window.getSelection();if(!sel||sel.isCollapsed)return null;let node=sel.anchorNode?.nodeType===3?sel.anchorNode.parentElement:sel.anchorNode;return node?.closest?.('.hl-brown,.hl-rose,.hl-blue')||null}
function handleToolbar(e){let act=e.target.closest('button')?.dataset.act;if(!act)return;let bar=$('#selbar'),target=bar.targetElem||highlightedFromSelection(),sel=window.getSelection();if(act==='del'&&target){unwrap(target);removeNote(target.dataset.hid)}else if(act==='hl'){if(target){if(target.classList.contains('hl-brown'))target.className='hl-rose';else if(target.classList.contains('hl-rose'))target.className='hl-rose';else target.className='hl-brown'}else{let span=wrapSelection('hl-brown');if(span)span.dataset.hid='h_'+Date.now()}}else if(act==='note'){let span=target||wrapSelection('hl-blue');if(span){span.className='hl-blue';if(!span.dataset.hid)span.dataset.hid='n_'+Date.now();createNote(span);document.body.classList.add('notes-open')}}bar.hidden=true;sel.removeAllRanges();save(false)}
function wrapSelection(cls){let sel=window.getSelection();if(!sel||sel.isCollapsed)return null;let range=sel.getRangeAt(0);if(!$('#content').contains(range.commonAncestorContainer))return null;let span=document.createElement('span');span.className=cls;try{range.surroundContents(span)}catch{span.appendChild(range.extractContents());range.insertNode(span)}return span}
function unwrap(el){let p=el.parentNode;if(!p)return;while(el.firstChild)p.insertBefore(el.firstChild,el);p.removeChild(el);p.normalize()}
function clearUserHighlights(){$$('.hl-brown,.hl-rose,.hl-blue').forEach(unwrap)}
function createNote(span){let id=span.dataset.hid;if($(`.note-card[data-hid="${id}"]`))return;let card=document.createElement('div');card.className='note-card';card.dataset.hid=id;card.innerHTML=`<div class="note-quote">${esc(span.textContent.slice(0,120))}</div><textarea placeholder="Write note here..."></textarea><button class="delete-note" type="button">Delete</button>`;$('#notesList').prepend(card);bindNoteDeletes()}
function bindNoteDeletes(){$$('#notesList textarea').forEach(t=>t.oninput=()=>save(false));$$('.delete-note').forEach(btn=>btn.onclick=()=>{let card=btn.closest('.note-card'),id=card.dataset.hid,span=$(`[data-hid="${id}"]`);if(span)unwrap(span);card.remove();save(false)})}
function removeNote(id){if(!id)return;$(`.note-card[data-hid="${id}"]`)?.remove()}
function drawTimer(){let m=Math.floor(secs/60),s=secs%60;$('#timer').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
const DEFAULT_FONT_SIZE=16,MIN_FONT_SIZE=14,MAX_FONT_SIZE=22;
function currentFontSize(){return Number.parseInt(document.documentElement.style.fontSize,10)||DEFAULT_FONT_SIZE}
function setFontSize(size,persist=true){let n=Math.max(MIN_FONT_SIZE,Math.min(MAX_FONT_SIZE,Number(size)||DEFAULT_FONT_SIZE));document.documentElement.style.fontSize=n===DEFAULT_FONT_SIZE?'':n+'px';updateSizeButtons();if(persist)save(false)}
function adjustFontSize(delta){setFontSize(currentFontSize()+delta,true)}
function updateSizeButtons(){let size=currentFontSize(),dark=document.body.classList.contains('dark');$('#fontMinus')?.toggleAttribute('disabled',size<=MIN_FONT_SIZE);$('#fontPlus')?.toggleAttribute('disabled',size>=MAX_FONT_SIZE);$('#fontDefault')?.classList.toggle('active',size===DEFAULT_FONT_SIZE);$('#lightBtn')?.classList.toggle('active',!dark);$('#darkBtn')?.classList.toggle('active',dark)}
function resetAppearance(persist=true){document.body.classList.remove('dark');setFontSize(DEFAULT_FONT_SIZE,false);updateSizeButtons();if(persist)save(false)}
function clearAllProgress(){localStorage.removeItem(storeKey)}
$('#finish').onclick=finish;$('#save').onclick=()=>save(true);$('#clear').onclick=()=>{if(confirm('Clear all progress?')){window.resetTest();showToast('Clear complete')}};$('#toggleNotes').onclick=()=>{document.body.classList.toggle('notes-open');save(false)};$('#closeNotes').onclick=()=>{document.body.classList.remove('notes-open');save(false)};$('#toggleIntensive').onclick=()=>{toggleIntensive();save(false)};$('#settingsBtn').onclick=()=>{$('#settings').classList.toggle('open');updateSizeButtons()};$('#lightBtn').onclick=()=>{document.body.classList.remove('dark');updateSizeButtons();save(false)};$('#darkBtn').onclick=()=>{document.body.classList.add('dark');updateSizeButtons();save(false)};$('#appearanceReset').onclick=()=>resetAppearance(true);$('#fontMinus').onclick=()=>adjustFontSize(-1);$('#fontPlus').onclick=()=>adjustFontSize(1);$('#fontDefault').onclick=()=>setFontSize(DEFAULT_FONT_SIZE,true);$('#settings').addEventListener('wheel',e=>{e.preventDefault();adjustFontSize(e.deltaY>0?-1:1)},{passive:false});document.addEventListener('keydown',e=>{if(!e.ctrlKey&&!e.metaKey)return;let key=e.key;if(key==='+'||key==='='){e.preventDefault();adjustFontSize(1)}else if(key==='-'||key==='_'){e.preventDefault();adjustFontSize(-1)}else if(key==='0'){e.preventDefault();resetAppearance(true)}});
const audio=$('#audio');$('#play').onclick=()=>audio.paused?audio.play():audio.pause();audio.onplay=()=>$('#play').textContent='⏸';audio.onpause=()=>$('#play').textContent='▶';audio.ontimeupdate=()=>{if(audio.duration)$('#fillbar').style.width=(audio.currentTime/audio.duration*100)+'%';$('#time').textContent=`${Math.floor(audio.currentTime/60)}:${String(Math.floor(audio.currentTime%60)).padStart(2,'0')} / ${audio.duration?Math.floor(audio.duration/60):'00'}:${audio.duration?String(Math.floor(audio.duration%60)).padStart(2,'0'):'00'}`;maintainCueLoop()};$('#speed').onchange=e=>{slowCue=false;audio.playbackRate=+e.target.value;save(false)};$('#bar').onclick=e=>{if(audio.duration){let r=e.currentTarget.getBoundingClientRect();audio.currentTime=(e.clientX-r.left)/r.width*audio.duration;save(false)}};
bindGlobal();render();
</script>
